# Cloudflare Pages configuration for horowitz.law
#
# Your Pages dashboard reports that environment variables are managed through
# this file, so the plaintext (non-secret) variables must live here to actually
# reach the Functions at runtime. SECRETS are NOT stored here: keep
# RESEND_API_KEY, SUBSCRIBE_SECRET, and TURNSTILE_SECRET_KEY in the Pages
# dashboard as encrypted Secrets (those still apply, and must never be
# committed to the repo).

name = "horowitz-law"            # must match your Pages project name exactly (the name in your *.pages.dev URL)
pages_build_output_dir = "public"  # static site served from public/; root holds tooling/data. functions/ stays at the project root (Cloudflare requirement), NOT inside public/.
compatibility_date = "2025-05-01"

# MIRRORED, and asserted: every value below also exists in scripts/siteconfig.py, because it is
# read at two runtimes that cannot import each other -- the Functions here (JS, at request time)
# and the Python pipeline (digest.py). Drift is silent and expensive: confirm.js writes a new
# subscriber into RESEND_SEGMENT_ID and opts them into RESEND_TOPIC_ID, while digest.py sends to
# those same ids, so a mismatch means people subscribe, see the success page, and never receive an
# email with nothing erroring. scripts/check_site.py fails CI if any value here disagrees with
# siteconfig, if one goes missing, or if a NEW var is added without deciding whether it is mirrored
# or wrangler-only. Edit a value in BOTH files, in the same commit.
[vars]
DIGEST_FROM = "Georgia Appellate Watch <digest@horowitz.law>"
RESEND_LEGISLATION_SEGMENT_ID = "96550305-4a0b-4b3b-8a3d-0ed29b0dbabf"
RESEND_LEGISLATION_TOPIC_ID = "1144774b-0574-4e25-9160-4fe148e18c5c"
RESEND_SEGMENT_ID = "1ae517f5-5981-4f7b-bed1-606cfa5649ab"
RESEND_TOPIC_ID = "52b81509-0230-4d3d-b5ff-393409df3b2c"
SITE_URL = "https://horowitz.law"

# -------------------------------------------------------------------------
# RECOMMENDED: an active rate limit for POST /api/subscribe. Turnstile alone
# does NOT bound how many confirmation emails a solved-challenge farm can send
# to attacker-supplied addresses (an email-bombing / sender-reputation risk for
# digest@horowitz.law), so this endpoint needs a real limiter, not just the
# human check. Make sure EITHER a Cloudflare WAF "Rate limiting rule"
# (dashboard > Security > WAF) is active, OR the in-code binding below is
# enabled -- do not leave both off.
#
# functions/api/subscribe/index.js uses the binding below ONLY if it exists
# (and silently skips it otherwise, so leaving this commented cannot break the
# Pages build). When enabled it limits on BOTH the source IP and the
# destination email, so one victim address can't be bombed from a rotating IP
# pool.
#
# To enable: confirm your Pages project supports the `ratelimit` binding, then
# uncomment. `period` must be 10 or 60 (seconds); `namespace_id` is any
# integer-as-string unique to your account. Requires Wrangler >= 4.36.
#
# [[ratelimits]]
# name = "SUBSCRIBE_RATELIMIT"
# namespace_id = "1001"
#
#   [ratelimits.simple]
#   limit = 3      # matches the active WAF rule: 3 requests / 10s, then a 10s block
#   period = 10
# -------------------------------------------------------------------------
