version: 2
# Keep the GitHub Actions used by the workflows (checkout, setup-python,
# create-pull-request, upload-artifact) current. Dependabot opens a PR when a new
# version is released, so the actions stay patched without hand-pinning a SHA that
# would otherwise go stale. Action updates are infrequent, so this is low PR volume.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Python deps pinned in requirements.txt / requirements-ci.txt (pypdf, pyyaml). pypdf parses
  # untrusted court PDFs inside jobs holding secrets, so keeping it patched is a security concern,
  # not just hygiene. Dependabot opens a CI-gated PR on each release; automerge.yml merges it on
  # green CI. The pypdf MAJOR bump is ignored to hold the 5.x line (the former `>=5,<6` cap); drop
  # this ignore and validate the funnel by hand to move to 6.x.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "pypdf"
        update-types: ["version-update:semver-major"]
 
