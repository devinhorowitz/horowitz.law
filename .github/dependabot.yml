version: 2
# Keep the GitHub Actions used by the workflows (checkout, setup-python,
# create-pull-request, upload-artifact) current. Dependabot opens a PR when a new
# version is released, so the actions stay patched without hand-pinning a SHA that
# would otherwise go stale. Action updates are infrequent, so this is low PR volume.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Python deps pinned in requirements.txt / requirements-ci.txt (pypdf, pyyaml). pypdf parses
  # untrusted court PDFs inside jobs holding secrets, so keeping it patched is a security concern,
  # not just hygiene. Dependabot opens a PR on each release. It is NOT CI-gated: ci.yml's path
  # filter excludes requirements*.txt, so only ruff, CodeQL and the Cloudflare preview check it,
  # and automerge.yml's gate (`gh pr checks`, which counts NEUTRAL as passing) is weaker than green
  # CI. Review a pip bump before merging. No major-version cap: the 5.x line is EOL for security fixes (several DoS advisories
  # are 6.x-only), so pypdf tracks the latest 6.x and beyond.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

