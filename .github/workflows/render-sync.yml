name: Georgia Appellate Watch render sync

# Safety net for the rendered pages. opinions.json is the source of truth; the
# pages (opinions.html, archive.html, opinions.xml) are generated from it by
# scripts/render.py and are supposed to stay in lockstep. They can fall out of
# sync two ways: a page uploaded by hand from a working copy whose opinions.json
# was behind main (which silently reverts whatever cards the pipeline added in the
# meantime), or the rolling two-year feed window aging a card out between renders.
# This re-renders from the committed opinions.json and, only if the pages have
# drifted, opens a review PR to correct them. It never touches opinions.json.

on:
  schedule:
    - cron: '37 5 * * *'     # once a day, offset from the every-4-hours update run. Drift is
                             # rare, so a daily net is enough; run it on demand from the
                             # Actions tab any time. Adjust freely.
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write
  issues: write          # the failure-alert step opens or comments on a tracking issue

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: opinions-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10      # render is seconds of work; fail fast if something hangs
    steps:
      # Supply-chain hardening (block mode): only the endpoints below are reachable.
      #   github.com      checkout and the branch push/delete (git-remote-http); seen in audit.
      #   api.github.com  create-pull-request opening and labeling the PR when the pages
      #                   drift, and the gh failure-alert step. Both are gated (drift /
      #                   if: failure()), so a clean no-diff run never reaches them, but
      #                   normal runs do. The job's pull-requests/issues:write scopes exist
      #                   for exactly these two REST paths.
      # setup-python used the runner's cached 3.12 here, so it fetched nothing. If an image
      #   ever lacks it, the tarball fetch annotates as Blocked; add objects.githubusercontent.com
      #   and raw.githubusercontent.com then. Actions cache/infra endpoints are auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            api.github.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # Re-render the three output files from the committed opinions.json. Pure standard
      # library, no API keys and no network, so this is cheap and safe to run often.
      # render() is deterministic: on a repo whose pages already match opinions.json this
      # changes nothing, so the PR step below then opens nothing.
      - name: Re-render pages from opinions.json
        run: python scripts/render.py

      # If, and only if, the committed pages had drifted from what render() produces, there
      # are now changes to stage and this opens (or updates) a single review PR. opinions.json
      # is read-only here and is never staged, so this can only correct the rendered output,
      # never the data. Confirm the latest tag at github.com/peter-evans/create-pull-request
      # before pinning.
      - name: Open a render-sync PR if the pages drifted
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/opinions-render
          title: 'Georgia Appellate Watch: re-render pages from opinions.json'
          commit-message: 'opinions: re-render pages to match opinions.json'
          body: |
            Automated re-render. The committed `opinions.html`, `archive.html`, or
            `opinions.xml` had drifted from what `scripts/render.py` produces from the
            current `opinions.json`, and this brings them back in sync.

            This usually means either a page was uploaded by hand from a working copy whose
            `opinions.json` was behind `main` (which silently reverts cards the pipeline had
            added), or the rolling two-year feed window aged a card out since the last render.
            Review the diff: it should only add, restore, or drop cards, never change wording.
            `opinions.json` is not touched by this workflow.
          labels: opinions, automated, render
          delete-branch: true
          # The three generated pages, plus the files render.py now also keeps
          # current: sitemap lastmod for the pages it owns, and the footer year
          # on the static pages (which only ever changes on the Jan 1 rollover,
          # so this daily net carries that PR).
          add-paths: |
            opinions.html
            archive.html
            opinions.xml
            sitemap.xml
            index.html
            resume.html
            colophon.html
            subscribe.html
            404.html
            changes.html
            stats.html
            digests.html
            changes.xml
            o
            .well-known/security.txt
            devin-horowitz.vcf
            areas

      # One-glance record on the run page: whether the pages had drifted (a PR opened to
      # reconcile) or already matched opinions.json (nothing to do).
      - name: Run summary
        if: success()
        env:
          PR: ${{ steps.pr.outputs.pull-request-number }}
          OP: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          {
            echo "## Render sync"
            echo ""
            if [ -n "$PR" ]; then
              echo "Pages had drifted from \`opinions.json\`; ${OP:-opened} PR #$PR to reconcile."
            else
              echo "Pages already match \`opinions.json\`; no drift."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Surfaces a broken run instead of letting it fail silently: comments on the one
      # open tracking issue, or opens it the first time, so repeated failures collect
      # on a single issue rather than spamming new ones.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="A scheduled render-sync run failed. ${run_url}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Render-sync run failures' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Render-sync run failures" --body "$body"
          fi
