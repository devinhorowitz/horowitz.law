name: Ruff lint

on:
  pull_request: {}
  # Also lint commits pushed straight to main (bots, the golden build, review-apply):
  # ruff otherwise runs on PRs only, so a direct-to-main push skipped it entirely.
  push:
    paths:
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # Egress observed in audit run 27872008274 (step-initiated only;
          # Actions cache/infra endpoints are auto-allowed by Harden-Runner):
          #   github.com                 checkout clone and action fetch
          #   raw.githubusercontent.com  ruff-action version manifest (astral-sh/versions)
          #   releases.astral.sh         ruff binary download
          # ruff itself runs offline. If a future bump adds an endpoint, the run
          # annotates it as Blocked; add it here after confirming it is legitimate.
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Enforced: a finding outside the ruff.toml ignore list fails the check.
      - name: Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check --output-format=github"
          src: "./scripts"
