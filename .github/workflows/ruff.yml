name: Ruff lint

on:
  # Only PRs that can change what ruff sees: the code it lints (src below is ./scripts; ruff.toml
  # adds no other include), its config, and this workflow. The bots' data-only PRs (new cards,
  # render-sync, treatment) change no Python, and linting them only parked a run in
  # action_required on every one.
  pull_request:
    paths:
      - 'scripts/**'
      - 'ruff.toml'
      - '.github/workflows/ruff.yml'
  # Also lint Python pushed straight to main by hand, which has no PR run to catch it. No bot
  # pushes Python: the direct-to-main bots commit data and state files only, and model-watch's
  # scripts/ edits ride a PR, linted above.
  push:
    paths:
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Egress observed in audit run 27872008274 (step-initiated only;
          # Actions cache/infra endpoints are auto-allowed by Harden-Runner):
          #   github.com                 checkout clone and action fetch
          #   raw.githubusercontent.com  ruff-action version manifest (astral-sh/versions)
          #   releases.astral.sh         ruff binary download
          # ruff itself runs offline. If a future bump adds an endpoint, the run
          # annotates it as Blocked; add it here after confirming it is legitimate.
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Enforced: a finding outside the ruff.toml ignore list fails the check.
      - name: Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check --output-format=github"
          src: "./scripts"
