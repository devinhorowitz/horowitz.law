name: Georgia Appellate Watch digest

# Runs LAST in the weekly cycle, on purpose. The daily update (forward treatment
# escalation) and the Saturday reverse sweep both flag earlier cards that later
# decisions treat adversely; those land in PRs you review and merge. This job
# checks out main and reads the merged opinions.json, so it sends only what is
# merged and signals any card flagged this week (a "flagged this week" section).
# Keep it after the Saturday sweep and merge the week's correction PRs before it
# runs; Monday gives the weekend as the buffer. To control timing exactly, merge
# first, then trigger this by hand from the Actions tab.
on:
  schedule:
    - cron: '0 13 * * 1'      # Mondays at 13:00 UTC (about 8-9am Eastern), after the Saturday sweep. Adjust freely.
  workflow_dispatch:           # run it by hand from the Actions tab
    inputs:
      days:
        description: 'Lookback window in days'
        required: false
        default: '7'
      dry_run:
        description: 'Render a preview without sending (true/false)'
        required: false
        default: 'false'
      draft:
        description: 'Create the broadcast but do not send it, to review in Resend (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write          # the failure-alert step opens or comments on a tracking issue

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: gaw-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20     # watchdog: the email broadcast is quick; fail fast if it stalls
    steps:
      # Supply-chain hardening (block mode).
      # Resend send job, no pip, no funnel:
      #   api.resend.com  the broadcast send.
      #   github.com      checkout of merged main.
      #   api.github.com  the failure-alert gh step only.
      # The dry-run artifact upload uses auto-allowed Actions storage; cache/infra auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.resend.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            api.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Build and send the digest
        env:
          # Secret (Settings > Secrets and variables > Actions > Secrets).
          # IMPORTANT: broadcasts need a Full-access key (contacts + broadcast), not send-only.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Variables (non-secret; Settings > Secrets and variables > Actions > Variables):
          RESEND_SEGMENT_ID: ${{ vars.RESEND_SEGMENT_ID }}
          RESEND_TOPIC_ID: ${{ vars.RESEND_TOPIC_ID }}
          RESEND_AREA_TOPICS: ${{ vars.RESEND_AREA_TOPICS }}
          # Legislative & Regulatory Watch: a separate broadcast, inert until these are set.
          RESEND_LEGISLATION_SEGMENT_ID: ${{ vars.RESEND_LEGISLATION_SEGMENT_ID }}
          RESEND_LEGISLATION_TOPIC_ID: ${{ vars.RESEND_LEGISLATION_TOPIC_ID }}
          LEGISLATION_SITE_URL: ${{ vars.LEGISLATION_SITE_URL }}
          DIGEST_FROM: ${{ vars.DIGEST_FROM }}
          DIGEST_POSTAL: ${{ vars.DIGEST_POSTAL }}
          DIGEST_DISCLAIMER: ${{ vars.DIGEST_DISCLAIMER }}
          DIGEST_PREHEADER: ${{ vars.DIGEST_PREHEADER }}
          SITE_URL: ${{ vars.SITE_URL }}
          # From the manual run inputs (defaults for the scheduled run):
          DIGEST_DAYS: ${{ github.event.inputs.days || '7' }}
          DIGEST_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DIGEST_DRAFT: ${{ github.event.inputs.draft || 'false' }}
        run: |
          set -o pipefail
          python scripts/digest.py 2>&1 | tee "$RUNNER_TEMP/run.log"

      - name: Upload preview (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-preview
          path: digest_preview.html
          if-no-files-found: ignore

      # Surfaces a broken run instead of letting it fail silently: comments on the one
      # open tracking issue, or opens it the first time, so repeated failures collect
      # on a single issue rather than spamming new ones.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          logtail=$(tail -c 3500 "$RUNNER_TEMP/run.log" 2>/dev/null || true)
          body=$(printf 'A scheduled digest run failed.\n\n%s\n\n**Last output**\n\n```\n%s\n```\n' "$run_url" "${logtail:-(no run output captured)}")
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Digest run failures' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Digest run failures" --body "$body"
          fi

      # Symmetric with the step above: once a later run completes cleanly, close the tracking issue so
      # a fixed or transient failure does not leave a stale open issue on an unattended deployment
      # (same self-heal the heartbeat and maintenance jobs already do). No-op when none is open;
      # best-effort so a gh hiccup here never fails the run.
      - name: Close the failure issue on a healthy run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Digest run failures"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title --jq ".[] | select(.title==\"$title\") | .number" 2>/dev/null || true); do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Recovered: a later digest run completed cleanly. Closing automatically." || true
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" || true
          done
