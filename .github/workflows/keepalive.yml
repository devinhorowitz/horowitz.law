name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days with no commits to the
# default branch. During a quiet stretch -- a court recess, a run of days where the
# funnel cards nothing, or an unmerged opinions PR keeping the daily guard skipping --
# that would silently disable every schedule in this repo until re-enabled by hand.
# This commits a tiny dated marker on a cadence well inside 60 days, which counts as
# repository activity and keeps all the schedules alive regardless of feed activity.
#
# Note: this pushes directly to the default branch. If you later protect the default
# branch to require pull requests, give this workflow a path around that (or switch
# it to open a PR), or the push will fail.
on:
  schedule:
    - cron: '13 7 * * 1'   # weekly, Monday 07:13 UTC (margin to spare inside 60 days)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write          # the failure-alert step opens or comments on a tracking issue

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Commit a keepalive marker
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push

      # Surfaces a broken run instead of letting it fail silently: comments on the one
      # open tracking issue, or opens it the first time, so repeated failures collect
      # on a single issue rather than spamming new ones.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="A keepalive run failed. ${run_url}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Keepalive run failures' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Keepalive run failures" --body "$body"
          fi
