name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days with no commits to the
# default branch. During a quiet stretch -- a court recess, a run of days where the
# funnel cards nothing, or an unmerged opinions PR keeping the daily guard skipping --
# that would silently disable every schedule in this repo until re-enabled by hand.
# This commits a tiny dated marker on a cadence well inside 60 days, which counts as
# repository activity and keeps all the schedules alive regardless of feed activity.
#
# Note: this pushes directly to the default branch. If you later protect the default
# branch to require pull requests, give this workflow a path around that (or switch
# it to open a PR), or the push will fail.
on:
  schedule:
    - cron: '13 7 * * 1'   # weekly, Monday 07:13 UTC (margin to spare inside 60 days)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Commit a keepalive marker
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push
