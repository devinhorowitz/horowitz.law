name: CI

# Runs on every push or PR that touches the pipeline or the site surface.
# Catches, as a red check on the commit instead of silently at the next
# scheduled run: a syntax error or broken import; a mis-uploaded filename
# (e.g. "cl rate.py" with a space, also caught by check_site); a CSP hash
# that no longer matches the inline script; a stale ?v= asset token; a
# malformed feed or sitemap; and a hand-edited generated page that drifted
# from what render.py produces.
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'public/**'
      - 'opinions.json'
      - 'functions/**'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'public/**'
      - 'opinions.json'
      - 'functions/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Supply-chain hardening (block mode).
      # Parse/validate gate, all-local except:
      #   github.com  checkout.
      #   pypi.org / files.pythonhosted.org  the pypdf+pyyaml install.
      # No funnel, no gh step. Cache/infra endpoints are auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Compile and import every script
        run: |
          python -m py_compile scripts/*.py
          # Import every non-test module, glob-derived so a newly added script cannot silently
          # skip this check (the hand-maintained list used to omit modules -- batch, siteconfig).
          cd scripts && python -c "import glob, os, importlib; [importlib.import_module(os.path.basename(f)[:-3]) for f in sorted(glob.glob('*.py')) if not os.path.basename(f).startswith('test_')]; print('all imports resolve')"

      # Imports resolving is not enough: a script can import fine yet call a sibling
      # function that was dropped or renamed (a stale upload that reverts
      # update.search_window is the case that motivated this). This asserts every
      # first-party module.attr reference in the scripts resolves against the module.
      - name: Cross-module references resolve
        run: python scripts/check_refs.py

      # Hermetic unit tests for the pipeline's own logic (no network, no API key): they stub
      # update.anthropic_json (and the maintenance text fetch), so they add no allowed-endpoints.
      # They pin the funnel's false-flag guardrails and docket-aware dedup (test_update.py) and the
      # maintenance dual-guard re-validation wiring (test_maintain.py).
      - name: Self-tests
        run: |
          # Every hermetic test, glob-derived so a new test_*.py runs automatically (no hand list to
          # forget). All are network-free and stub update.anthropic_json, so they add no endpoints.
          for t in scripts/test_*.py; do echo "--- $t"; python "$t"; done

      - name: Validate workflow YAML
        run: python -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('workflow YAML parses')"

      - name: JS syntax
        run: |
          node --check public/app.js
          node --check public/opinions.js
          node --check public/subscribe.js && node --check public/sw.js
          node --check functions/api/subscribe/index.js
          node --check functions/api/subscribe/confirm.js
          node --check functions/_middleware.js

      - name: Site invariants (CSP hash, ?v tokens, scripts/ names, XML)
        run: python scripts/check_site.py

      # The committed pages must be exactly what render.py produces from the committed opinions.json;
      # a hand-uploaded stale page (wrong wording, a missing new card) fails here at push time instead
      # of waiting for the daily render-sync net.
      - name: Render idempotency
        run: |
          # Render AS OF the last funnel render (status.json scanned_at), not the live clock. The
          # committed pages are whatever the funnel/render-sync last produced; between their runs the
          # clock can drift past a card's rolling-2-year edge (or the Jan-1 footer year), which would
          # make a naive re-render differ until the next reconciliation and fail this byte-for-byte
          # check on an unrelated PR. Pinning the render date to scanned_at reproduces exactly what
          # was committed, so only REAL drift (stale wording, a card the committed page is missing)
          # fails -- those still diverge because they don't depend on the clock. Falls back to real
          # today if status.json is unreadable (strict, as before).
          export OPINIONS_RENDER_ASOF="$(python -c "import json; print(json.load(open('public/status.json'))['scanned_at'][:10])" 2>/dev/null || true)"
          python scripts/render.py
          # -N (intent-to-add) makes never-committed generated files visible to
          # the diff, so a forgotten o/ upload fails here instead of 404ing live.
          git add -N public/o
          git diff --exit-code -- public/opinions.html public/archive.html public/opinions.xml public/sitemap.xml public/index.html public/resume.html public/colophon.html public/subscribe.html public/404.html public/changes.html public/stats.html public/digests.html public/changes.xml public/legislation.html public/legislation.xml public/regulations.xml public/o public/areas public/devin-horowitz.vcf
