name: CI

# Runs on every push or PR that touches the pipeline or the site surface.
# Catches, as a red check on the commit instead of silently at the next
# scheduled run: a syntax error or broken import; a mis-uploaded filename
# (e.g. "cl rate.py" with a space, also caught by check_site); a CSP hash
# that no longer matches the inline script; a stale ?v= asset token; a
# malformed feed or sitemap; and a hand-edited generated page that drifted
# from what render.py produces.
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'public/**'
      - 'opinions.json'
      - 'functions/**'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'public/**'
      - 'opinions.json'
      - 'functions/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Supply-chain hardening (block mode).
      # Parse/validate gate, all-local except:
      #   github.com  checkout.
      #   pypi.org / files.pythonhosted.org  the pypdf+pyyaml install.
      # No funnel, no gh step. Cache/infra endpoints are auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --upgrade "pypdf>=5,<6" pyyaml

      - name: Compile and import every script
        run: |
          python -m py_compile scripts/*.py
          cd scripts && python -c "import cl_rate, safeio, jurisdictions, render, treatment_core, update, treatment, backfill, digest, queue_cases, courts, golden_check, model_watch, check_site, alert, official_ga, maintain, skill_authorities, skill_alert, review_store, review_apply; print('all imports resolve')"

      # Imports resolving is not enough: a script can import fine yet call a sibling
      # function that was dropped or renamed (a stale upload that reverts
      # update.search_window is the case that motivated this). This asserts every
      # first-party module.attr reference in the scripts resolves against the module.
      - name: Cross-module references resolve
        run: python scripts/check_refs.py

      # Hermetic unit tests for the pipeline's own logic (no network, no API key): they stub
      # update.anthropic_json (and the maintenance text fetch), so they add no allowed-endpoints.
      # They pin the funnel's false-flag guardrails and docket-aware dedup (test_update.py) and the
      # maintenance dual-guard re-validation wiring (test_maintain.py).
      - name: Self-tests
        run: |
          python scripts/test_update.py
          python scripts/test_maintain.py
          python scripts/test_model_watch.py
          python scripts/test_batch.py
          python scripts/test_backfill.py
          python scripts/test_review.py
          python scripts/test_treatment.py
          python scripts/test_queue_cases.py
          python scripts/test_digest.py
          python scripts/test_golden_check.py

      - name: Validate workflow YAML
        run: python -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('workflow YAML parses')"

      - name: JS syntax
        run: |
          node --check public/app.js
          node --check public/opinions.js
          node --check public/subscribe.js && node --check public/sw.js
          node --check functions/api/subscribe/index.js
          node --check functions/api/subscribe/confirm.js
          node --check functions/_middleware.js

      - name: Site invariants (CSP hash, ?v tokens, scripts/ names, XML)
        run: python scripts/check_site.py

      # The committed pages must be exactly what render.py produces from the
      # committed opinions.json; a hand-uploaded stale page fails here at push
      # time instead of waiting for the daily render-sync net. (Once a year, on
      # the first push after Jan 1, this fails with footer-year diffs until the
      # render-sync rollover PR merges; the diff itself says so.)
      - name: Render idempotency
        run: |
          python scripts/render.py
          # -N (intent-to-add) makes never-committed generated files visible to
          # the diff, so a forgotten o/ upload fails here instead of 404ing live.
          git add -N public/o
          git diff --exit-code -- public/opinions.html public/archive.html public/opinions.xml public/sitemap.xml public/index.html public/resume.html public/colophon.html public/subscribe.html public/404.html public/changes.html public/stats.html public/digests.html public/changes.xml public/o public/areas public/devin-horowitz.vcf
