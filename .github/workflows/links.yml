name: Link check

on:
  schedule:
    - cron: '0 7 * * 1'   # weekly, Monday 07:00 UTC; gentle on CourtListener, catches link rot
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write          # opens or updates a tracking issue when links break

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Lychee
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --base-url https://horowitz.law
            --accept 200,202,206,403,405,429,999
            './**/*.html'
          fail: false        # report via issue, do not fail the run
          # --base-url resolves root-relative internal links (/opinions, /o/*, /fonts/*)
          #   against the live site, where Cloudflare's .html-stripping makes them resolve.
          # accept codes are alive-but-non-200 bot responses, not rot:
          #   202 CourtListener async render, 403/405 court-site bot blocks, 999 LinkedIn.
          #   404/410/5xx/timeout/DNS still flag, so genuine rot is still caught.
      - name: Open an issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: Link checker found broken links
          content-filepath: ./lychee/out.md
          labels: automated, link-rot
