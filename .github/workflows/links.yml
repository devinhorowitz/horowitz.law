name: Link check

on:
  schedule:
    - cron: '0 7 * * 1'   # weekly, Monday 07:00 UTC; gentle on CourtListener, catches link rot
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write          # opens or updates a tracking issue when links break

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 5
            --base-url https://horowitz.law
            --accept 200,202,206,403,405,429,999
            './**/*.html'
          fail: false        # report via issue, do not fail the run
          # --base-url resolves root-relative internal links (/opinions, /o/*, /fonts/*)
          #   against the live site, where Cloudflare's .html-stripping makes them resolve.
          # accept codes are alive-but-non-200 bot responses, not rot:
          #   202 CourtListener async render, 403/405 court-site bot blocks, 999 LinkedIn.
          #   404/410/5xx/timeout/DNS still flag, so genuine rot is still caught.
          # --max-retries/--retry-wait-time: a court site or CourtListener that briefly 5xx's or
          #   times out is retried (3 attempts, 5s apart) before it counts as rot. Unattended, this
          #   is the main false-positive source -- one transient blip would otherwise file a broken-
          #   links issue for a link that is actually fine. Real rot fails all retries and still flags.
      # Reuse the one open link-rot issue instead of filing a fresh one every Monday: unattended,
      # a weekly cron would otherwise stack duplicate issues for the same unfixed broken link. Look
      # up the existing open issue by exact title and hand its number to create-issue-from-file,
      # which updates that issue (fresh body) when issue-number is set and creates one when it isn't.
      - name: Find an existing link-rot issue
        id: existing
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Link checker found broken links"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          echo "number=$num" >> "$GITHUB_OUTPUT"
      - name: Open or update the broken-links issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link checker found broken links
          content-filepath: ./lychee/out.md
          labels: automated, link-rot
          issue-number: ${{ steps.existing.outputs.number }}
      # Symmetric with the open step: when the weekly check comes back clean (exit_code 0, no broken
      # links after the retries added above), close the tracking issue so a link that was rotten and
      # is now fixed -- or was only transiently down -- does not leave a stale issue open on an
      # unattended deployment. No-op when none is open; best-effort so a gh hiccup never fails the run.
      - name: Close the link-rot issue when the check is clean
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Link checker found broken links"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title --jq ".[] | select(.title==\"$title\") | .number" 2>/dev/null || true); do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Recovered: the weekly link check found no broken links. Closing automatically." || true
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" || true
          done
