name: Georgia Appellate Watch treatment sweep

# Reverse citation sweep. Short runs every few hours rather than one long weekly
# sweep -- see the cron note below. Leave dry_run checked the
# first time to preview the citing opinions and any flags in the run log without
# writing anything or opening a PR; uncheck it (or let the cron run) to write.
on:
  schedule:
    # Was a single weekly run (Saturdays 13:17) with a 5-hour budget. That run spent most of
    # its time ASLEEP: treatment.py waits for the CourtListener hourly window to refill rather
    # than stopping, so a two-hour sweep was largely a runner sitting idle. Idle time is the
    # exposure that gets a job reclaimed (seven reclamations since 2026-07-17, every one while
    # waiting), and the sweep lost its entire run three times on 2026-08-01.
    #
    # Same CourtListener throughput ceiling, spread over short runs instead of one long one.
    # Safe because the sweep is already resumable: treatment_state.json carries per-card
    # progress, a card cut short is simply not marked full and resumes next run, and
    # FIRST_PER_RUN/FIRST_PAGES already bound each run's work.
    - cron: '41 */6 * * *'   # every 6 hours, off-peak minute; was weekly
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview citing opinions + flags in the log; write nothing, open no PR)'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write          # the failure-alert step opens or comments on a tracking issue

env:
  PYTHONUNBUFFERED: '1'

# Separate group from the daily update and the backfill so none blocks another.
concurrency:
  group: opinions-treatment
  cancel-in-progress: false

jobs:
  treatment:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # a short run now; the old 350 backstopped a 5-hour budget
    steps:
      # Supply-chain hardening (block mode).
      # Funnel egress, same eight as opinions:
      #   api.anthropic.com / status.claude.com  the treatment classifier and the outage preflight.
      #   www.courtlistener.com / storage.courtlistener.com  citation search, REST, citing-opinion text.
      #   pypi.org / files.pythonhosted.org  the pypdf install.
      #   github.com / api.github.com  checkout+PR push, the PR-open and failure-alert gh steps.
      # Cache/infra endpoints are auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            status.claude.com:443
            www.courtlistener.com:443
            storage.courtlistener.com:443
            pypi.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            api.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sweep citations, classify treatment, flag adversely-treated cards
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          # CourtListener REST budget. Set these repo Variables on a tier change; unset = free-tier defaults in cl_rate.py.
          CL_PER_MINUTE: ${{ vars.CL_PER_MINUTE }}
          CL_PER_HOUR: ${{ vars.CL_PER_HOUR }}
          CL_PER_DAY: ${{ vars.CL_PER_DAY }}
          CL_RATE_MARGIN: ${{ vars.CL_RATE_MARGIN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # The run is bounded by this, by CL_PER_DAY, and by the job timeout. Override via the
          # TREATMENT_BUDGET_SEC repo Variable.
          #
          # 8 minutes, not 5 hours: the budget is also how long the run will WAIT on a filled
          # rate window, so it was the direct cause of the idle exposure. Six runs a day at 8
          # minutes buys more working time per week than one run at five hours, without ever
          # leaving a runner asleep.
          TREATMENT_BUDGET_SEC: ${{ inputs.dry_run && '300' || (vars.TREATMENT_BUDGET_SEC || '480') }}
          # Per-run throughput ceilings, sized for a short run repeated through the day rather
          # than one long weekly pass. Ceilings, not targets: a steady-state run has little to
          # do. A dry-run preview keeps the small defaults. Override via repo Variables.
          TREATMENT_PER_RUN: ${{ inputs.dry_run && '25' || (vars.TREATMENT_PER_RUN || '40') }}
          TREATMENT_PER_CARD: ${{ inputs.dry_run && '6' || (vars.TREATMENT_PER_CARD || '50') }}
          # Bounded like the funnel's, and for the same reason: a long batch wait is idle
          # exposure. _classify_batch already defers the card on BatchTimeout and retries it.
          TREATMENT_BATCH_SEC: ${{ vars.TREATMENT_BATCH_SEC || '180' }}
        run: |
          set -o pipefail
          python scripts/treatment.py 2>&1 | tee "$RUNNER_TEMP/run.log"

      # In a dry run the script writes nothing, so this finds no changes and opens
      # no PR. In a real run it opens or updates one PR: the caution flags it raised
      # (opinions.json + re-rendered html/xml), the sweep progress (treatment_state.json),
      # and the run report as the body.
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/opinions-treatment
          title: 'Georgia Appellate Watch: treatment sweep'
          commit-message: 'opinions: flag cards treated adversely by later decisions'
          body-path: scripts/treatment_pr_body.md
          labels: opinions, automated, treatment
          delete-branch: true
          # `add-paths` is a literal block scalar: every line is a path pattern, so the
          # explanation goes here rather than inside it.
          #
          # treatment_state.json is the sweep's progress, and it must stay on this list. It was
          # dropped by 1807fba (2026-07-25), which regenerated every add-paths list from render's
          # OUTPUT_PATHS -- a list of RENDER outputs, which this file is not. The sweep then ran
          # 17 times reporting success while committing no progress: the same 3 never-swept cards
          # took a full-history crawl every 6 hours and their results were discarded, and the 12
          # cards added since were never swept at all. scripts/test_workflow_state_paths.py now
          # fails if a workflow drops the state file its own script writes.
          add-paths: |
            opinions.json
            treatment_state.json
            public/.well-known/security.txt
            public/404.html
            public/archive.html
            public/areas
            public/changes.html
            public/changes.xml
            public/colophon.html
            public/devin-horowitz.vcf
            public/digests.html
            public/index.html
            public/legislation.html
            public/legislation.xml
            public/o
            public/opinions.html
            public/opinions.xml
            public/regulations.xml
            public/api/feed.json
            public/resume.html
            public/sitemap.xml
            public/stats.html
            public/subscribe.html
      # Surfaces a broken run instead of letting it fail silently: comments on the one
      # open tracking issue, or opens it the first time, so repeated failures collect
      # on a single issue rather than spamming new ones.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          logtail=$(tail -c 3500 "$RUNNER_TEMP/run.log" 2>/dev/null || true)
          body=$(printf 'A scheduled treatment sweep run failed.\n\n%s\n\n**Last output**\n\n```\n%s\n```\n' "$run_url" "${logtail:-(no run output captured)}")
          num=$(bash scripts/gh_retry.sh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Treatment sweep run failures' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            bash scripts/gh_retry.sh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            bash scripts/gh_retry.sh issue create --repo "$GITHUB_REPOSITORY" --title "Treatment sweep run failures" --body "$body"
          fi
