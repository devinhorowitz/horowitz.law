name: Georgia Appellate Watch treatment sweep

# Reverse citation sweep. Runs on a weekend, when the daily updater finds no new
# opinions and the CourtListener REST budget is free. Leave dry_run checked the
# first time to preview the citing opinions and any flags in the run log without
# writing anything or opening a PR; uncheck it (or let the cron run) to write.
on:
  schedule:
    - cron: '17 13 * * 6'    # Saturdays at 13:17 UTC, about an hour after the 12:17 daily slot (the daily runs at :17 past every fourth hour)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview citing opinions + flags in the log; write nothing, open no PR)'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write          # the failure-alert step opens or comments on a tracking issue

env:
  PYTHONUNBUFFERED: '1'

# Separate group from the daily update and the backfill so none blocks another.
concurrency:
  group: opinions-treatment
  cancel-in-progress: false

jobs:
  treatment:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # backstop under GitHub's 6h hard cap; a run finishes well before this
    steps:
      # Supply-chain hardening (block mode).
      # Funnel egress, same eight as opinions:
      #   api.anthropic.com / status.claude.com  the treatment classifier and the outage preflight.
      #   www.courtlistener.com / storage.courtlistener.com  citation search, REST, citing-opinion text.
      #   pypi.org / files.pythonhosted.org  the pypdf install.
      #   github.com / api.github.com  checkout+PR push, the PR-open and failure-alert gh steps.
      # Cache/infra endpoints are auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            status.claude.com:443
            www.courtlistener.com:443
            storage.courtlistener.com:443
            pypi.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            api.github.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sweep citations, classify treatment, flag adversely-treated cards
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          # CourtListener REST budget. Set these repo Variables on a tier change; unset = free-tier defaults in cl_rate.py.
          CL_PER_MINUTE: ${{ vars.CL_PER_MINUTE }}
          CL_PER_HOUR: ${{ vars.CL_PER_HOUR }}
          CL_PER_DAY: ${{ vars.CL_PER_DAY }}
          CL_RATE_MARGIN: ${{ vars.CL_RATE_MARGIN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # Long budget so a real run drains across rate windows in one pass; a dry-run preview stays short.
          # The run is bounded by this, by CL_PER_DAY, and by the job timeout. Override via the TREATMENT_BUDGET_SEC repo Variable.
          TREATMENT_BUDGET_SEC: ${{ inputs.dry_run && '900' || (vars.TREATMENT_BUDGET_SEC || '18000') }}
          # Throughput ceilings raised for a real run so the backlog clears in one pass. They are ceilings, not targets:
          # steady-state weeks have little to do. A dry-run preview keeps the small defaults. Override via repo Variables.
          TREATMENT_PER_RUN: ${{ inputs.dry_run && '25' || (vars.TREATMENT_PER_RUN || '300') }}
          TREATMENT_PER_CARD: ${{ inputs.dry_run && '6' || (vars.TREATMENT_PER_CARD || '50') }}
          TREATMENT_MODEL: ${{ vars.TREATMENT_MODEL || 'claude-sonnet-5' }}     # full-read classifier; set the repo Variable to update without editing this file
        run: |
          set -o pipefail
          python scripts/treatment.py 2>&1 | tee "$RUNNER_TEMP/run.log"

      # In a dry run the script writes nothing, so this finds no changes and opens
      # no PR. In a real run it opens or updates one PR: the caution flags it raised
      # (opinions.json + re-rendered html/xml), the sweep progress (treatment_state.json),
      # and the run report as the body.
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/opinions-treatment
          title: 'Georgia Appellate Watch: treatment sweep'
          commit-message: 'opinions: flag cards treated adversely by later decisions'
          body-path: scripts/treatment_pr_body.md
          labels: opinions, automated, treatment
          delete-branch: true
          add-paths: |
            opinions.json
            public/opinions.xml
            public/opinions.html
            public/archive.html
            public/sitemap.xml
            treatment_state.json

      # Surfaces a broken run instead of letting it fail silently: comments on the one
      # open tracking issue, or opens it the first time, so repeated failures collect
      # on a single issue rather than spamming new ones.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          logtail=$(tail -c 3500 "$RUNNER_TEMP/run.log" 2>/dev/null || true)
          body=$(printf 'A scheduled treatment sweep run failed.\n\n%s\n\n**Last output**\n\n```\n%s\n```\n' "$run_url" "${logtail:-(no run output captured)}")
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Treatment sweep run failures' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Treatment sweep run failures" --body "$body"
          fi
