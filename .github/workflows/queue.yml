name: Georgia Appellate Watch queue

# Add a case by committing its CourtListener URL (or cluster id) to queue.txt: this
# runs it through the funnel and opens the editorial PR you review and merge. Manual
# dispatch is also available -- e.g. to retry deferred lines, or with resolve_only to
# validate resolution first without spending any model calls.
on:
  push:
    branches: [main]          # main only: the bot PR branch rewrites queue.txt, and that
                              # push must NOT re-trigger this workflow (it would loop).
    paths: ['queue.txt']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview cards + outcomes in the log; write nothing, open no PR)'
        type: boolean
        default: false
      resolve_only:
        description: 'Resolve only (look up cluster/court/text and print; call no model, change nothing)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write          # the failure-alert step opens or comments on a tracking issue

env:
  PYTHONUNBUFFERED: '1'

# Own group, separate from the daily update and the backfill, so a queue run neither
# blocks nor is blocked by them. Each opens its own PR branch off main.
concurrency:
  group: opinions-queue
  cancel-in-progress: false

jobs:
  queue:
    # A queue PR merge pushes the drained queue.txt back to main, which matches this
    # workflow's own path filter; the rerun would only no-op. Skip it outright: the
    # merge commit message carries the bot branch name (merge commit) or the PR title
    # (squash), neither of which appears on a human queue edit.
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, 'bot/opinions-queue') &&
       !contains(github.event.head_commit.message, 'queued case'))
    runs-on: ubuntu-latest
    timeout-minutes: 45     # watchdog: bound a stuck run well under GitHub's 6h cap
    steps:
      # Supply-chain hardening (block mode).
      # Funnel egress, same eight as opinions:
      #   api.anthropic.com / status.claude.com  triage+summary calls and the outage preflight.
      #   www.courtlistener.com / storage.courtlistener.com  cluster resolve, REST, PDF text.
      #   pypi.org / files.pythonhosted.org  the pypdf install.
      #   github.com / api.github.com  checkout+PR push, the PR-open and failure-alert gh steps.
      # Cache/infra endpoints are auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            status.claude.com:443
            www.courtlistener.com:443
            storage.courtlistener.com:443
            pypi.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            api.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Screen queued case(s) through the funnel and render
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          # CourtListener REST budget. Set these repo Variables on a tier change; unset = free-tier defaults in cl_rate.py.
          CL_PER_MINUTE: ${{ vars.CL_PER_MINUTE }}
          CL_PER_HOUR: ${{ vars.CL_PER_HOUR }}
          CL_PER_DAY: ${{ vars.CL_PER_DAY }}
          CL_RATE_MARGIN: ${{ vars.CL_RATE_MARGIN }}
          # The queue is a curated, latency-insensitive path (<= QUEUE_MAX lines under a
          # 45-minute watchdog), so give each cluster resolve a generous deadline instead
          # of the 30s daily-pipeline default: one slow CourtListener response inside a
          # 30s window killed the resolve twice on 2026-07-25 (cl_get's per-attempt read
          # timeout is 20s, leaving no room for a single retry).
          OPINIONS_CL_DEADLINE_SEC: '120'
          # Models come from scripts/update.py, the same pins the daily pipeline runs. The
          # queue skips the Tier-1 Haiku screen by its own logic (the input is curated, see
          # queue_cases.py), not by leaving a variable unset.
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          QUEUE_RESOLVE_ONLY: ${{ inputs.resolve_only && '1' || '' }}
        run: python scripts/queue_cases.py

      # In dry_run / resolve_only the script writes nothing, so this finds no changes
      # and opens no PR. Otherwise it opens or updates one PR with the run report as the
      # body, the new card(s) in opinions.json, the re-rendered html/xml, and the drained
      # queue.txt. Confirm the latest tag at github.com/peter-evans/create-pull-request.
      # The drop-reason audit verdicts this run established go STRAIGHT TO MAIN, not through
      # the editorial PR, exactly as smell.yml commits the same file. They are bookkeeping: they
      # record that a human-grade read happened, and nothing about them needs an editor's eye.
      #
      # They used to ride the PR (add-paths, 2026-09-12). That was wrong in a way that only shows
      # up when the PR sits. queue_cases.stamp_audits rewrites the WHOLE log atomically, so the
      # branch carries a point-in-time snapshot of a file the 4-hourly funnel appends to every
      # run. PR #336 sat three days, main gained 131 records, and the merge conflicted -- the
      # queue.txt drain and the two verdicts in it could not land at all until the file was
      # reconciled by hand. A file written wholesale by one job and appended to by another does
      # not belong on a review branch.
      #
      # push_main.sh rebases onto freshly fetched main and retries, which is what makes this safe
      # against the funnel pushing in the same window.
      - name: Record audit verdicts on main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opinions_rejections.jsonl
          git commit -m "opinions: record queue-read audit verdicts [skip ci]" \
            || { echo "no audit verdicts to record"; exit 0; }
          bash scripts/push_main.sh

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/opinions-queue
          title: 'Georgia Appellate Watch: queued case(s)'
          commit-message: 'opinions: screen queued case(s) into the feed'
          body-path: scripts/queue_cases_pr_body.md
          labels: opinions, automated, queue
          delete-branch: true
          # add-paths is a literal block scalar, so every line in it is a PATH -- a "#" line
          # here is a filename, not a comment (test_workflow_state_paths pins that). Notes go
          # above the key. opinions_rejections.jsonl is deliberately NOT here: it is pushed
          # straight to main by the step above, because it is bookkeeping and must not wait on
          # an editorial review. See that step for what happened when it did.
          add-paths: |
            opinions.json
            queue.txt
            public/.well-known/security.txt
            public/404.html
            public/archive.html
            public/areas
            public/changes.html
            public/changes.xml
            public/colophon.html
            public/devin-horowitz.vcf
            public/digests.html
            public/index.html
            public/legislation.html
            public/legislation.xml
            public/o
            public/opinions.html
            public/opinions.xml
            public/regulations.xml
            public/api/feed.json
            public/resume.html
            public/sitemap.xml
            public/stats.html
            public/subscribe.html
            public/follow.html
      # Surfaces a broken run instead of letting it fail silently: comments on the one
      # open tracking issue, or opens it the first time, so repeated failures collect
      # on a single issue rather than spamming new ones.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="A queue run failed. ${run_url}"
          num=$(bash scripts/gh_retry.sh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Queue run failures' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            bash scripts/gh_retry.sh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            bash scripts/gh_retry.sh issue create --repo "$GITHUB_REPOSITORY" --title "Queue run failures" --body "$body"
          fi
