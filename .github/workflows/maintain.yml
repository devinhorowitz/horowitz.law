name: opinions-maintenance

# Budget-gated maintenance for the opinions funnel, with the repo keepalive and the
# court-registry check folded in: this one daily job replaces the former keepalive.yml
# and validate-courts.yml. Daily, off-peak, self-gating. It runs the CourtListener-free
# golden regression check and, only with comfortable CourtListener headroom, re-validates
# a small rotating slice of published cards (maintain.py writes nothing; findings go to a
# tracking issue). The keepalive marker commit runs first and unconditionally, so the
# repo stays active and GitHub does not auto-disable the scheduled workflows after 60
# days, even on a day maintenance surfaces a finding. Scheduled at 13:37 UTC, offset from
# the funnel's :17 ticks and clear of the Thursday 21:00 to 23:59 PT CourtListener window.
on:
  schedule:
    - cron: '37 13 * * *'
  workflow_dispatch:

permissions:
  contents: write         # the keepalive marker commit; maintain.py itself still writes nothing
  issues: write           # maintenance findings issue + the court-registry drift flag

concurrency:
  group: opinions-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30     # watchdog: the golden check + a small slice + the court check is minutes of work
    steps:
      # Supply-chain hardening (block mode). The external-link step was dropped (lychee
      # covers external links), leaving a bounded surface, the same five hosts golden-check runs:
      #   api.anthropic.com  cross-check and golden-check model calls.
      #   www.courtlistener.com / storage.courtlistener.com  court-registry validate, card text, PDF.
      #   github.com / api.github.com  checkout + keepalive push, and the issue-management gh steps.
      # Cache/infra endpoints are auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            www.courtlistener.com:443
            storage.courtlistener.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            api.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keepalive (folded from keepalive.yml): a daily marker commit keeps the repository
      # active so GitHub does not auto-disable the scheduled workflows after 60 days.
      # First and unconditional, so it happens even if a later step surfaces a finding;
      # [skip ci] and a path CI does not watch, so it never spins CI.
      - name: Keepalive marker
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive [skip ci]" || { echo "nothing to commit"; exit 0; }
          bash scripts/push_main.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      # Court-registry check (folded from validate-courts.yml): confirm every court id in
      # jurisdictions.py still resolves at CourtListener. Capture the exit code without
      # failing the job (0 clean, 3 drift, 4 a transient throttle/network defer, anything
      # else a real operational error), so maintenance below still runs; drift and real
      # errors surface as issues, while a transient defer just logs a notice.
      - name: Validate court registry
        id: courts
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: |
          set +e
          ( cd scripts && python courts.py --validate )
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Court registry drift flag
        if: ${{ steps.courts.outputs.code == '3' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Court registry drift detected"
          existing=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq "[.[] | select(.title==\"$title\")] | .[0].number" 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file scripts/court_drift.md
          else
            gh issue create --title "$title" --body-file scripts/court_drift.md
          fi

      - name: Court registry clean
        if: ${{ steps.courts.outputs.code == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Court registry drift detected"
          for n in $(gh issue list --state open --search "$title in:title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" 2>/dev/null || true); do
            gh issue comment "$n" --body "Resolved: the court-registry validation now passes."
            gh issue close "$n"
          done

      # A CourtListener throttle or a transient network blip deferred the check (exit 4):
      # no drift was assessed, but this is not an error and self-heals on the next run, so
      # log a notice and file nothing. The maintenance-findings issue stays for real problems.
      - name: Court registry validation deferred
        if: ${{ steps.courts.outputs.code == '4' }}
        run: echo "::notice title=Court registry::Validation deferred (CourtListener throttle or transient network, exit 4); no drift assessed, will retry next run."

      - name: Court registry validation error
        if: ${{ steps.courts.outputs.code != '0' && steps.courts.outputs.code != '3' && steps.courts.outputs.code != '4' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Court-registry validation hit a non-transient error (exit ${{ steps.courts.outputs.code }}), likely an auth or config problem, not drift. ${run_url}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Opinions maintenance findings' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Opinions maintenance findings" --body "$body"
          fi

      # Feed-shape canary: the funnel discovers new opinions by parsing each court's Atom feed, and
      # a silent CourtListener feed-format change would zero all discovery with no error until the
      # heartbeat notices 30 days later. This runs the real parser over the live feeds and flags the
      # unambiguous drift signature (entries present, zero candidates parsed) same-day. Feeds are the
      # free /feed/ path, so no token and no REST quota. Exit 0 clean, 3 drift, 4 soft (empty/outage).
      - name: Feed-shape canary
        id: feed
        run: |
          set +e
          python scripts/feed_check.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Feed-shape drift flag
        if: ${{ steps.feed.outputs.code == '3' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Feed-shape drift detected"
          existing=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq "[.[] | select(.title==\"$title\")] | .[0].number" 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file scripts/feed_check_alert.md
          else
            gh issue create --title "$title" --body-file scripts/feed_check_alert.md
          fi

      - name: Feed-shape check clean
        if: ${{ steps.feed.outputs.code == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Feed-shape drift detected"
          for n in $(gh issue list --state open --search "$title in:title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" 2>/dev/null || true); do
            gh issue comment "$n" --body "Resolved: the funnel's feed parser is extracting candidates again."
            gh issue close "$n"
          done

      # Exit 4: every feed empty or unreachable (a quiet stretch or a transient CL outage), not proof
      # of drift and self-healing, so log a notice and file nothing.
      - name: Feed-shape check soft
        if: ${{ steps.feed.outputs.code == '4' }}
        run: echo "::notice title=Feed-shape::No feed entries to assess (empty or unreachable, exit 4); not drift, will retry next run."

      - name: Run maintenance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          # Same models the funnel uses, so the golden check and the cross-check test
          # what production actually runs.
          OPINIONS_SCREEN_MODEL: ${{ vars.OPINIONS_SCREEN_MODEL || 'claude-haiku-4-5' }}
          OPINIONS_TRIAGE_MODEL: ${{ vars.OPINIONS_TRIAGE_MODEL || 'claude-sonnet-5' }}
          OPINIONS_CROSSCHECK_MODEL: ${{ vars.OPINIONS_CROSSCHECK_MODEL || 'claude-sonnet-5' }}
          # Reserve and slice are repo-variable tunable; defaults are conservative.
          OPINIONS_MAINT_RESERVE: ${{ vars.OPINIONS_MAINT_RESERVE || '50' }}
          OPINIONS_MAINT_SLICE: ${{ vars.OPINIONS_MAINT_SLICE || '3' }}
          # Route the slice's guards through the 50%-priced Batch API. Off by default; set the
          # repo Variable MAINTAIN_BATCH=1 to enable. The wait budget is capped at 1200s so the
          # in-run poll finishes well inside this job's 30-minute timeout; on a longer batch the
          # slice defers and the next daily run collects it, so nothing is lost.
          MAINTAIN_BATCH: ${{ vars.MAINTAIN_BATCH || '' }}
          OPINIONS_MAINT_BATCH_SEC: ${{ vars.OPINIONS_MAINT_BATCH_SEC || '1200' }}
        # Capture stdout as well as streaming it, so the failure step can put the ACTUAL
        # finding in the issue body. maintain.py exits 1 to mean "a person should look" --
        # a golden regression, a flagged card, a completeness gap -- and until now the issue
        # said only "a finding or an error" plus a run URL, which meant every one of them
        # required digging through a job log to learn what it found. Three were misread as
        # transient crashes before anyone read one.
        #
        # pipefail is load-bearing: without it the pipeline reports tee's exit status, the
        # step would SUCCEED on a real finding, and the issue would never be filed at all.
        run: |
          set -o pipefail
          python scripts/maintain.py 2>&1 | tee ./maintain-out.txt

      # A one-glance record of the daily chore on the run page: keepalive, the court-registry
      # outcome (from the validate step's exit code), and that the golden cross-check ran.
      - name: Run summary
        if: success()
        env:
          CODE: ${{ steps.courts.outputs.code }}
          FEED: ${{ steps.feed.outputs.code }}
        run: |
          case "$CODE" in
            0) reg="clean" ;;
            3) reg="drift detected (issue filed)" ;;
            4) reg="deferred (transient throttle or network)" ;;
            *) reg="error (exit ${CODE:-?})" ;;
          esac
          case "$FEED" in
            0) feed="parser healthy" ;;
            3) feed="DRIFT detected (issue filed)" ;;
            4) feed="no entries to assess (empty/unreachable)" ;;
            *) feed="unknown (exit ${FEED:-?})" ;;
          esac
          {
            echo "## Daily maintenance"
            echo ""
            echo "- Keepalive: committed"
            echo "- Court registry: $reg"
            echo "- Feed shape: $feed"
            echo "- Golden cross-check: ran"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report maintenance findings
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "Opinions maintenance flagged a finding or hit an error."
            echo ""
            echo "$run_url"
            echo ""
            echo "Last 100 lines of the run (a FAIL/GAP/FLAG line names what was found; a"
            echo "traceback instead means it really was an error):"
            echo ""
            echo '```'
            tail -n 100 ./maintain-out.txt 2>/dev/null || echo "(no output captured -- the step died before producing any)"
            echo '```'
          } > ./maintain-body.md
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Opinions maintenance findings' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file ./maintain-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Opinions maintenance findings" --body-file ./maintain-body.md
          fi

      # Symmetric with the step above, and with the two drift issues this workflow already
      # self-heals: once a later run completes cleanly, close the findings issue so a transient
      # failure (a network blip, an Anthropic credit lapse -- both of which have happened) does not
      # leave a stale open issue on an unattended deployment. Issue #209 sat open for exactly that
      # reason: this workflow could open the findings issue but never close it.
      #
      # The court-registry guard is not decoration. "Court registry validation error" opens THIS
      # issue on a non-transient exit code WITHOUT failing the job, so success() alone would let one
      # run open the issue and then immediately close it. The condition below is that step's
      # condition negated: 0 clean, and 3 drift / 4 deferred both leave this issue untouched (3
      # files its own "Court registry drift detected"); anything else means the error step fired.
      # Best-effort so a gh hiccup here never fails an otherwise healthy run.
      - name: Close the findings issue on a healthy run
        if: ${{ success() && (steps.courts.outputs.code == '0' || steps.courts.outputs.code == '3' || steps.courts.outputs.code == '4') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Opinions maintenance findings"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" 2>/dev/null || true); do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Recovered: a later maintenance run completed cleanly. Closing automatically." || true
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" || true
          done
