name: opinions-maintenance

# Budget-gated maintenance for the opinions funnel, with the repo keepalive and the
# court-registry check folded in: this one daily job replaces the former keepalive.yml
# and validate-courts.yml. Daily, off-peak, self-gating. It runs the CourtListener-free
# golden regression check and, only with comfortable CourtListener headroom, re-validates
# a small rotating slice of published cards (maintain.py writes nothing; findings go to a
# tracking issue). The keepalive marker commit runs first and unconditionally, so the
# repo stays active and GitHub does not auto-disable the scheduled workflows after 60
# days, even on a day maintenance surfaces a finding. Scheduled at 13:37 UTC, offset from
# the funnel's :17 ticks and clear of the Thursday 21:00 to 23:59 PT CourtListener window.
on:
  schedule:
    - cron: '37 13 * * *'
  workflow_dispatch:

permissions:
  contents: write         # the keepalive marker commit; maintain.py itself still writes nothing
  issues: write           # maintenance findings issue + the court-registry drift flag

concurrency:
  group: opinions-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30     # watchdog: the golden check + a small slice + the court check is minutes of work
    steps:
      # Supply-chain hardening (audit mode): records what this job sends over the
      # network, so you can review egress and later switch to block with an allowlist.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Keepalive (folded from keepalive.yml): a daily marker commit keeps the repository
      # active so GitHub does not auto-disable the scheduled workflows after 60 days.
      # First and unconditional, so it happens even if a later step surfaces a finding;
      # [skip ci] and a path CI does not watch, so it never spins CI.
      - name: Keepalive marker
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      # Court-registry check (folded from validate-courts.yml): confirm every court id in
      # jurisdictions.py still resolves at CourtListener. Capture the exit code without
      # failing the job (0 clean, 3 drift, 4 a transient throttle/network defer, anything
      # else a real operational error), so maintenance below still runs; drift and real
      # errors surface as issues, while a transient defer just logs a notice.
      - name: Validate court registry
        id: courts
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: |
          set +e
          ( cd scripts && python courts.py --validate )
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Court registry drift flag
        if: ${{ steps.courts.outputs.code == '3' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Court registry drift detected"
          existing=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq "[.[] | select(.title==\"$title\")] | .[0].number" 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file scripts/court_drift.md
          else
            gh issue create --title "$title" --body-file scripts/court_drift.md
          fi

      - name: Court registry clean
        if: ${{ steps.courts.outputs.code == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Court registry drift detected"
          for n in $(gh issue list --state open --search "$title in:title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" 2>/dev/null || true); do
            gh issue comment "$n" --body "Resolved: the court-registry validation now passes."
            gh issue close "$n"
          done

      # A CourtListener throttle or a transient network blip deferred the check (exit 4):
      # no drift was assessed, but this is not an error and self-heals on the next run, so
      # log a notice and file nothing. The maintenance-findings issue stays for real problems.
      - name: Court registry validation deferred
        if: ${{ steps.courts.outputs.code == '4' }}
        run: echo "::notice title=Court registry::Validation deferred (CourtListener throttle or transient network, exit 4); no drift assessed, will retry next run."

      - name: Court registry validation error
        if: ${{ steps.courts.outputs.code != '0' && steps.courts.outputs.code != '3' && steps.courts.outputs.code != '4' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Court-registry validation hit a non-transient error (exit ${{ steps.courts.outputs.code }}), likely an auth or config problem, not drift. ${run_url}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Opinions maintenance findings' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Opinions maintenance findings" --body "$body"
          fi

      # External link rot (folded in, not a standalone workflow): the hand-authored
      # pages link out to the firm, the bar, the courts, the schools, and LinkedIn,
      # whose URLs drift as institutions reorganize. check_site.py --links fetches them,
      # scoped to index.html and resume.html so the permalinks and CourtListener are never
      # touched. Capture the exit without failing the job (0 all resolve, 3 a link is dead
      # at 404/410, 4 only unreachable); a finding surfaces as an issue the same way the
      # court check does, and a bot-block or a transient blip never fails the run.
      - name: Check external links
        id: links
        run: |
          set +e
          python scripts/check_site.py --links
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: External link rot flag
        if: ${{ steps.links.outputs.code == '3' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Dead external link detected"
          existing=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq "[.[] | select(.title==\"$title\")] | .[0].number" 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file scripts/link_rot.md
          else
            gh issue create --title "$title" --body-file scripts/link_rot.md
          fi

      - name: External links clean
        if: ${{ steps.links.outputs.code == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Dead external link detected"
          for n in $(gh issue list --state open --search "$title in:title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" 2>/dev/null || true); do
            gh issue comment "$n" --body "Resolved: every external link on the hand-authored pages resolves again."
            gh issue close "$n"
          done

      - name: External link check deferred
        if: ${{ steps.links.outputs.code == '4' }}
        run: echo "::notice title=External links::Some links were unreachable (transient or bot-block); no rot confirmed, will retry next run."

      - name: Run maintenance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          # Same models the funnel uses, so the golden check and the cross-check test
          # what production actually runs.
          OPINIONS_SCREEN_MODEL: ${{ vars.OPINIONS_SCREEN_MODEL || 'claude-haiku-4-5-20251001' }}
          OPINIONS_TRIAGE_MODEL: ${{ vars.OPINIONS_TRIAGE_MODEL || 'claude-sonnet-4-6' }}
          OPINIONS_CROSSCHECK_MODEL: ${{ vars.OPINIONS_CROSSCHECK_MODEL || 'claude-sonnet-4-6' }}
          # Reserve and slice are repo-variable tunable; defaults are conservative.
          OPINIONS_MAINT_RESERVE: ${{ vars.OPINIONS_MAINT_RESERVE || '50' }}
          OPINIONS_MAINT_SLICE: ${{ vars.OPINIONS_MAINT_SLICE || '3' }}
        run: python scripts/maintain.py

      - name: Report maintenance findings
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Opinions maintenance flagged a finding or hit an error. ${run_url}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Opinions maintenance findings' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Opinions maintenance findings" --body "$body"
          fi
