name: Georgia Appellate Watch backfill

# Manual only. Run from the Actions tab. Leave dry_run checked the first time to
# preview the recall report and the drafted cards in the run log without writing
# anything or opening a PR; uncheck it to write the cards and open the PR.
#
# Two modes. Default: the pre-vetted QPWB skill seed (a recall test; screen/triage are
# recorded but not gating). Check "sweep" to instead discover a date-windowed PUBLISHED
# search per court and run the full gating funnel (screen/triage/summarize), filling the
# rolling window. Set date_from/date_to/courts to chunk it: the small courts (ga, ca11,
# scotus) fit one run each; chunk gactapp by quarter. One reusable PR branch
# (bot/opinions-backfill): review and merge each chunk before dispatching the next.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview recall report + cards in the log; write nothing, open no PR)'
        type: boolean
        default: true
      batch:
        description: 'Draft the seed summaries through the 50%-priced Batch API (skill-seed mode only). Off = one synchronous Opus call per cluster.'
        type: boolean
        default: false
      seed:
        description: 'Seed override: comma-separated cluster:court_id pairs (court_id in ga, gactapp, ca11, scotus). Blank = built-in skill seed.'
        type: string
        default: ''
      sweep:
        description: 'Sweep mode: discover a date-windowed PUBLISHED search per court and run the gating funnel (screen/triage/summarize). Unchecked = pre-vetted skill seed.'
        type: boolean
        default: false
      date_from:
        description: 'Sweep only: window start (filing date, inclusive), YYYY-MM-DD.'
        type: string
        default: '2024-06-12'
      date_to:
        description: 'Sweep only: window end (filing date, inclusive), YYYY-MM-DD.'
        type: string
        default: '2025-05-31'
      courts:
        description: 'Sweep only: comma-separated court ids (blank = ga,gactapp,ca11,scotus). Chunk gactapp by quarter to stay within one run.'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write          # the failure-alert step opens or comments on a tracking issue

env:
  PYTHONUNBUFFERED: '1'

# Separate group from the daily update so a manual backfill neither blocks nor is
# blocked by the cron. Both open their own PR branch off main, so their diffs stay
# independent.
concurrency:
  group: opinions-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # watchdog: bound a stuck seed run well under GitHub's 6h cap
    steps:
      # Supply-chain hardening (block mode).
      # Funnel egress; no preflight, so no status host:
      #   api.anthropic.com  screen/triage/summary calls.
      #   www.courtlistener.com / storage.courtlistener.com  windowed search/REST and PDF text.
      #   pypi.org / files.pythonhosted.org  the pypdf install.
      #   github.com / api.github.com  checkout+PR push, the PR-open and failure-alert gh steps.
      # Cache/infra endpoints are auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            www.courtlistener.com:443
            storage.courtlistener.com:443
            pypi.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            api.github.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed the archive (screen as recall test, triage, summarize, render)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          # CourtListener REST budget. Set these repo Variables on a tier change; unset = free-tier defaults in cl_rate.py.
          CL_PER_MINUTE: ${{ vars.CL_PER_MINUTE }}
          CL_PER_HOUR: ${{ vars.CL_PER_HOUR }}
          CL_PER_DAY: ${{ vars.CL_PER_DAY }}
          CL_RATE_MARGIN: ${{ vars.CL_RATE_MARGIN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          OPINIONS_SEED: ${{ inputs.seed }}
          # Batch API for the seed's Tier-3 summaries (skill-seed mode only). Default off; the
          # 60-min job timeout comfortably covers the 3300s wait budget. Combine batch=true with
          # dry_run=true for a no-write proving run that still exercises submit/poll/collect.
          BACKFILL_BATCH: ${{ inputs.batch && '1' || '' }}
          OPINIONS_BACKFILL_BATCH_SEC: ${{ vars.OPINIONS_BACKFILL_BATCH_SEC || '3300' }}
          # Sweep mode (BACKFILL_SWEEP=1) and its window; ignored by the skill-seed path.
          BACKFILL_SWEEP: ${{ inputs.sweep && '1' || '' }}
          BACKFILL_FROM: ${{ inputs.date_from }}
          BACKFILL_TO: ${{ inputs.date_to }}
          BACKFILL_COURTS: ${{ inputs.courts }}
          # Same three-tier funnel as the daily pipeline; same repo Variables.
          OPINIONS_SCREEN_MODEL: ${{ vars.OPINIONS_SCREEN_MODEL || 'claude-haiku-4-5-20251001' }}
          OPINIONS_TRIAGE_MODEL: ${{ vars.OPINIONS_TRIAGE_MODEL || 'claude-sonnet-5' }}
          OPINIONS_MODEL: ${{ vars.OPINIONS_MODEL || 'claude-opus-4-8' }}
        run: python scripts/backfill.py

      # In a dry run the script writes nothing, so this finds no changes and opens
      # no PR. In a real run it opens or updates one PR with the recall report as
      # the body and the grown opinions.json plus re-rendered html/xml.
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/opinions-backfill
          title: "${{ inputs.sweep && 'Georgia Appellate Watch: backfill (windowed sweep)' || 'Georgia Appellate Watch: backfill (skill seed)' }}"
          commit-message: "${{ inputs.sweep && 'opinions: windowed backfill sweep' || 'opinions: backfill seed of known skill-cases' }}"
          body-path: scripts/backfill_pr_body.md
          labels: opinions, automated, backfill
          delete-branch: true
          add-paths: |
            opinions.json
            public/opinions.xml
            public/opinions.html
            public/archive.html
            public/sitemap.xml
            public/changes.html
            public/changes.xml
            public/stats.html
            public/digests.html
            public/o

      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="A manually-triggered backfill run failed. ${run_url}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Backfill run failures' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Backfill run failures" --body "$body"
          fi
