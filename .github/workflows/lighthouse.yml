name: Lighthouse

on:
  schedule:
    - cron: '0 8 * * 1'   # weekly, Monday 08:00 UTC; monitors the deployed site for score drift
  workflow_dispatch: {}    # run on demand after a change you want to vet

permissions:
  contents: read
  issues: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # audit, not block, and permanently so: Lighthouse drives a real Chrome against the
      # deployed site, so the run fetches whatever horowitz.law's HTML happens to reference
      # -- fonts, feeds, any third-party asset a future page adds -- plus the action's own
      # Chrome download and the temporary-public-storage upload of each report. That set is
      # not knowable in advance, which is the same reason links.yml audits rather than
      # blocks. Nothing here handles a repo secret: permissions are contents: read plus
      # issues: write for the regression tracker.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22   # 20 is past its maintenance EOL; 22 is the current LTS
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
      # Open ONE tracking issue and comment on it on subsequent failures, rather than a fresh
      # issue every Monday -- unattended, a `gh issue create` on a weekly cron piles up dozens of
      # duplicates for a single unfixed regression. Dedup by exact title (same pattern as heartbeat).
      - name: Open or update the Lighthouse regression issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Lighthouse regression on the live site"
          body="A Lighthouse run failed its score assertions. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(bash scripts/gh_retry.sh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            bash scripts/gh_retry.sh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body" || true
          else
            bash scripts/gh_retry.sh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label automated --label perf --body "$body" || true
          fi
      # Symmetric with the step above: when a later run passes its (error-level) assertions, close the
      # regression issue so a fixed -- or transiently flaky -- score does not leave a stale issue open
      # on an unattended deployment. Performance is warn-only now (see lighthouserc.json), so this
      # fires when accessibility/best-practices/seo are all green. Best-effort; never fails the run.
      - name: Close the regression issue on a healthy run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Lighthouse regression on the live site"
          for n in $(bash scripts/gh_retry.sh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title --jq ".[] | select(.title==\"$title\") | .number" 2>/dev/null || true); do
            bash scripts/gh_retry.sh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Recovered: a later Lighthouse run passed its assertions. Closing automatically." || true
            bash scripts/gh_retry.sh issue close "$n" --repo "$GITHUB_REPOSITORY" || true
          done
