name: Lighthouse

on:
  schedule:
    - cron: '0 8 * * 1'   # weekly, Monday 08:00 UTC; monitors the deployed site for score drift
  workflow_dispatch: {}    # run on demand after a change you want to vet

permissions:
  contents: read
  issues: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22   # 20 is past its maintenance EOL; 22 is the current LTS
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
      # Open ONE tracking issue and comment on it on subsequent failures, rather than a fresh
      # issue every Monday -- unattended, a `gh issue create` on a weekly cron piles up dozens of
      # duplicates for a single unfixed regression. Dedup by exact title (same pattern as heartbeat).
      - name: Open or update the Lighthouse regression issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Lighthouse regression on the live site"
          body="A Lighthouse run failed its score assertions. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label automated --label perf --body "$body" || true
          fi
      # Symmetric with the step above: when a later run passes its (error-level) assertions, close the
      # regression issue so a fixed -- or transiently flaky -- score does not leave a stale issue open
      # on an unattended deployment. Performance is warn-only now (see lighthouserc.json), so this
      # fires when accessibility/best-practices/seo are all green. Best-effort; never fails the run.
      - name: Close the regression issue on a healthy run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Lighthouse regression on the live site"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title --jq ".[] | select(.title==\"$title\") | .number" 2>/dev/null || true); do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Recovered: a later Lighthouse run passed its assertions. Closing automatically." || true
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" || true
          done
