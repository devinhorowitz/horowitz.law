name: Model watch (Claude model pins)

# A Dependabot for the funnel's Claude model pins. From the 4.6 generation onward an
# Anthropic model id is a fixed snapshot: a newer model ships under a new id and the old
# id never changes, so a pin neither drifts nor upgrades on its own. This checks the
# Models API daily for a newer model in each tier's own family (Opus summarizer, Sonnet
# triage, Haiku screen) and, when one appears, rewrites the pin, runs the golden set
# against the candidate, and opens a review PR. It proposes; a human merges. A tier above
# Opus (Fable/Mythos) is reported, never auto-proposed.
#
# TOKEN: the PR step uses a PAT in the MODEL_WATCH_TOKEN secret, a fine-grained token
# scoped to this repo with Contents and Pull requests set to write. Without it, detection
# and the golden-set eval still run, but no PR opens (the run says so).
#
# WHERE A VERDICT GOES. Every golden verdict -- pass or regression, with the failing cases --
# is posted once to the "Model watch: candidate model evaluation" issue, PR or no PR, and is
# remembered in model_watch_state.json (committed to main). An unchanged candidate is not
# re-evaluated, re-posted, or re-failed the next day; a new model, prompt, effort level or
# golden-set edit changes the memo key and buys exactly one fresh evaluation.
#
# WORKFLOWS SCOPE IS NO LONGER NEEDED, and should be revoked on the token. It was required
# because a bump rewrote each funnel workflow's `|| 'id'` model fallback, and GitHub forbids
# the default GITHUB_TOKEN from pushing to .github/workflows/. Those 25 fallbacks were
# removed on 2026-08-18 -- the pins live in scripts/update.py and scripts/treatment.py only
# -- so model_watch.PIN_FILES no longer touches this directory and the elevated scope is
# standing privilege with nothing behind it.

on:
  schedule:
    - cron: '23 6 * * *'   # daily, offset from the funnel and render-sync. Detection is a single
                           # Models-API GET; the model-spend golden eval runs only on an upgrade.
  workflow_dispatch: {}    # run by hand from the Actions tab any time

permissions:
  contents: write
  pull-requests: write
  issues: write          # the verdict issue and the failure-alert issue

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: model-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Block egress to all but: api.anthropic.com (the Models API and the golden eval's
      # model calls), github.com / api.github.com (checkout, the PR push, and the gh
      # failure-alert step), and the pip endpoints (pypdf, pulled because golden_check
      # imports update). Actions cache/infra endpoints are auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt   # golden_check imports update, which imports pypdf

      # Map the PAT secret to an output so later steps gate on a plain value (secrets are
      # awkward to reference inside an `if:`). Prints nothing about the secret itself.
      - name: Detect PAT
        id: pat
        env:
          TOK: ${{ secrets.MODEL_WATCH_TOKEN }}
        run: echo "has=$([ -n "$TOK" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"


      # Detect a newer model per tier and, if any, rewrite the pins in place (the script
      # defaults in model_watch.PIN_FILES) so the eval below tests the candidate and a merged
      # PR takes effect. No edits when nothing is newer. Exit 3 means update.py's effort rule
      # disagrees with the Models API about a pin or candidate: nothing is judged, and the
      # failure reporter files it.
      - name: Check the Models API and stage any bump
        id: watch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/model_watch.py --apply

      # Golden-set gate, only when a bump was staged. update.py reads the model from its
      # now-edited default, so this runs the new model, through the production request
      # builders and so at the production effort (siteconfig.MODEL_EFFORT), the same level the
      # incumbent runs at. `check` covers the screen/triage tiers; `summarize` covers the Opus
      # summarizer.
      #
      # --memo: a verdict already reached for this exact candidate, prompt set, effort and golden
      # set is reported from model_watch_state.json with no model calls. golden_check writes
      # memo_<mode>=hit|miss to the step output; a regression is a NEW one only on a miss.
      #
      # A regression (exit 1) is captured, not fatal here, so the PR and the tracking issue still
      # get the result; the fail step below fails the run once, on a new regression only. Any
      # other nonzero exit (3: bad key, no credit or a retired model; 4: a crash) judged nothing,
      # so it fails this step outright and the failure reporter below files it.
      - name: Golden-set check against the candidate
        id: eval
        if: steps.watch.outputs.upgrade == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BODY: ${{ steps.watch.outputs.body_path }}
        run: |
          rc=0
          fresh=false
          { echo ""; echo "### Golden-set result (candidate model)"; echo ""; } >> "$BODY"
          if [ "${{ steps.watch.outputs.run_check }}" = "true" ]; then
            code=0; python scripts/golden_check.py check --memo || code=$?
            seen=remembered; if grep -qx "memo_check=miss" "$GITHUB_OUTPUT"; then seen=new; fi
            case "$code" in
              0) echo "- \`check\` (screen/triage): no regression ($seen verdict)" >> "$BODY" ;;
              1) rc=1; if [ "$seen" = new ]; then fresh=true; fi
                 echo "- \`check\` (screen/triage): **REGRESSION** ($seen verdict), do not merge as-is" >> "$BODY" ;;
              *) echo "::error::golden_check check exited $code: a broken run, not a regression"; exit "$code" ;;
            esac
          fi
          if [ "${{ steps.watch.outputs.run_summarize }}" = "true" ]; then
            code=0; python scripts/golden_check.py summarize --memo || code=$?
            seen=remembered; if grep -qx "memo_summarize=miss" "$GITHUB_OUTPUT"; then seen=new; fi
            case "$code" in
              0) echo "- \`summarize\` (Opus): no dropped area ($seen verdict)" >> "$BODY" ;;
              1) rc=1; if [ "$seen" = new ]; then fresh=true; fi
                 echo "- \`summarize\` (Opus): **REGRESSION** ($seen verdict), a covered area was dropped" >> "$BODY" ;;
              *) echo "::error::golden_check summarize exited $code: a broken run, not a regression"; exit "$code" ;;
            esac
          fi
          if [ "$rc" -eq 0 ]; then echo "regressed=false" >> "$GITHUB_OUTPUT"; else echo "regressed=true" >> "$GITHUB_OUTPUT"; fi
          echo "fresh_regression=$fresh" >> "$GITHUB_OUTPUT"

      # Open (or update) the review PR with the staged bump. The PAT is still needed to open
      # the PR; since 2026-08-18 the diff no longer touches .github/workflows/*, so it no
      # longer needs Workflows scope. Skipped cleanly when the PAT is unset.
      - name: Open the bump PR
        id: pr
        if: steps.watch.outputs.upgrade == 'true' && steps.pat.outputs.has == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.MODEL_WATCH_TOKEN }}
          branch: bot/model-watch
          title: 'Funnel: a newer Claude model is available'
          commit-message: 'models: bump funnel model pin(s) to the newest in-tier release'
          body-path: ${{ steps.watch.outputs.body_path }}
          labels: models, automated
          delete-branch: true
          # Exactly model_watch.PIN_FILES, the files a bump rewrites (test_model_watch holds the
          # two equal: a file left off here is bumped on the runner but never reaches the PR).
          # opinions.json, the generated pages and model_watch_state.json are never committed
          # here; the memo goes straight to main in "Record the golden verdicts on main".
          add-paths: |
            scripts/update.py
            scripts/treatment.py
            scripts/courtrules.py
            scripts/ethics.py
            scripts/legislation.py
            scripts/regulations.py

      # If an upgrade exists but no PAT is configured, say so on the run summary. The verdict
      # itself reaches a person through the tracking issue below, not only this summary.
      - name: Note when no PAT is configured
        if: steps.watch.outputs.upgrade == 'true' && steps.pat.outputs.has != 'true'
        run: |
          if [ "${{ steps.eval.outputs.regressed }}" = "true" ]; then
            result="but it REGRESSED on the golden set (see the eval step), so do not apply it as-is"
          else
            result="and it passed the golden set"
          fi
          {
            echo "## Model watch"
            echo ""
            echo "A newer model is available, $result. MODEL_WATCH_TOKEN is not set, so no PR"
            echo "was opened; the verdict is on the \"Model watch: candidate model evaluation\" issue."
            echo "Add a PAT with Contents and Pull requests write in that secret, or apply the bump"
            echo "by hand from the log."
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail the run on a NEW regression, so it shows red once. A remembered regression (same
      # candidate, prompts, effort and golden set) was already reported and does not fail again:
      # re-failing an unchanged verdict every day is noise, not signal.
      - name: Fail on a new regression
        id: regression
        if: steps.eval.outputs.fresh_regression == 'true'
        run: |
          echo "Golden-set regression on the candidate model; the verdict is on the tracking issue."
          exit 1

      # The one place a verdict reaches a person whether or not a PR could open: ONE tracking
      # issue, commented on (or opened) once per verdict. model_watch marks a posted verdict
      # `reported` in the memo, so a remembered verdict is not posted again. It runs after the
      # fail step on purpose, so the run's own report follows its failure (scripts/run_watchdog.py
      # reads a failure with no reporting step after it as unreported).
      - name: Report the candidate verdict on the tracking issue
        id: issue
        if: always() && steps.watch.outputs.upgrade == 'true' && steps.eval.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          # mode=key, the memo keys golden_check reported in the eval step, so the lookup does not
          # depend on this working tree still holding the bump after the PR step.
          modes=""
          if [ -n "${{ steps.eval.outputs.key_check }}" ]; then modes="check=${{ steps.eval.outputs.key_check }}"; fi
          if [ -n "${{ steps.eval.outputs.key_summarize }}" ]; then modes="${modes:+$modes,}summarize=${{ steps.eval.outputs.key_summarize }}"; fi
          python scripts/model_watch.py --report-issue "$modes"

      # Nothing newer in any tier (the bump was applied, or the candidate went away): close the
      # tracking issue. Best-effort, so a gh hiccup here never fails a healthy run.
      - name: Close the candidate issue when all pins are current
        if: steps.watch.outputs.upgrade == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/model_watch.py --close-issue || echo "::warning::could not close the model-watch tracking issue"

      # Persist the memo (golden verdicts and whether each was reported) so tomorrow's run does
      # not pay for them again. Bookkeeping, so it goes straight to main, the way queue.yml
      # records its audit verdicts: from a throwaway worktree of HEAD, because this checkout
      # holds the uncommitted pin bump, which must never reach main. PUSH_MAIN_REGENERATE redoes
      # the copy on each freshly fetched main instead of rebasing. Runs whenever the eval ran, so
      # a verdict reached before a later mode broke is kept.
      - name: Record the golden verdicts on main
        id: record
        if: always() && steps.eval.outcome != 'skipped'
        run: |
          if [ ! -f model_watch_state.json ]; then
            echo "no golden verdicts to record"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ws="$PWD"
          wt="$RUNNER_TEMP/memo"
          git worktree add --detach "$wt" HEAD
          trap 'git -C "$ws" worktree remove --force "$wt"' EXIT
          cd "$wt"
          export MEMO="$ws/model_watch_state.json"
          export PUSH_MAIN_REGENERATE='
            cp "$MEMO" model_watch_state.json
            git add model_watch_state.json
            git diff --cached --quiet || git commit -m "model-watch: record golden-set verdicts"'
          bash "$ws/scripts/push_main.sh"

      # Surface a genuinely broken run on the "Model-watch run failures" issue. A new regression
      # that reached the tracking issue is expected signal, not a broken run, so it is excluded;
      # anything else that failed is filed: a bad key or no credit (exit 3), a crash, an effort
      # rule out of date, a regression whose report or memo commit failed.
      - name: Report a failed run
        if: failure() && (steps.regression.outcome != 'failure' || steps.issue.outcome != 'success' || steps.record.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="A scheduled model-watch run failed. ${run_url}"
          num=$(bash scripts/gh_retry.sh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Model-watch run failures' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            bash scripts/gh_retry.sh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            bash scripts/gh_retry.sh issue create --repo "$GITHUB_REPOSITORY" --title "Model-watch run failures" --body "$body"
          fi
