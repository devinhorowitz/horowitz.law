name: golden-check

# Regression guard for the opinions funnel. Run by hand from the Actions tab.
#   check      re-runs the real screen+triage tiers against cached opinion text and reports
#              any regression. No CourtListener calls; safe to run after any prompt change.
#   build      fetches and caches opinion text for entries missing it (one-time CL cost),
#              then commits the updated scripts/golden_set.json. Run after adding cases.
#   summarize  re-runs the real Opus summarizer on the cached keepers and asserts the
#              produced areas still cover each case's expected areas. No CourtListener calls;
#              spends Opus budget, so run it on a summarizer change. Exits nonzero on a drop.
#   recall     runs the Tier 1.5 pretriage screen alone on each cached keeper and fails if it
#              would drop one. No CourtListener calls. Run before enabling pretriage in production.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (full funnel on cached text), build (fetch+cache text), summarize (assert area coverage), or recall (pretriage-only keeper check)"
        type: choice
        options: [check, build, summarize, recall]
        default: check

permissions:
  contents: write          # build commits the cached scripts/golden_set.json
  issues: write            # the failure-alert step opens or comments on a tracking issue

concurrency:
  group: golden-check
  cancel-in-progress: false

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30     # watchdog: a hung build or summarize run fails fast, well under the 6h cap
    steps:
      # Supply-chain hardening (block mode): only the endpoints below are reachable.
      #   api.anthropic.com         the screen/triage/summarize/pretriage model calls (every mode).
      #   github.com                checkout (every run); golden_set.json push in build mode.
      #   www.courtlistener.com     build mode only: fetch opinion text to cache.
      #   storage.courtlistener.com build mode only: the PDF text behind that fetch.
      #   api.github.com            the gh failure-alert step (only on a failed run).
      # A check/summarize/recall run reaches only Anthropic and github; the CourtListener
      # hosts and api.github are here for build and failure paths a single run won't exercise.
      # Actions cache/infra endpoints are auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            api.github.com:443
            www.courtlistener.com:443
            storage.courtlistener.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Run golden ${{ inputs.mode }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          # Use the same models as the daily funnel, so the guard tests what production runs.
          # Pretriage defaults to Haiku here even though the daily workflow ships it off, since
          # the guard's job is to test it before it is enabled in production.
          OPINIONS_SCREEN_MODEL: ${{ vars.OPINIONS_SCREEN_MODEL || 'claude-haiku-4-5-20251001' }}
          OPINIONS_PRETRIAGE_MODEL: ${{ vars.OPINIONS_PRETRIAGE_MODEL || 'claude-haiku-4-5-20251001' }}
          OPINIONS_TRIAGE_MODEL: ${{ vars.OPINIONS_TRIAGE_MODEL || 'claude-sonnet-5' }}
          OPINIONS_MODEL: ${{ vars.OPINIONS_MODEL || 'claude-opus-4-8' }}
        run: python scripts/golden_check.py ${{ inputs.mode }}

      # build refreshes the cached text in scripts/golden_set.json; persist it. The cache is
      # data, not editorial content, so it commits straight to main. [skip ci] avoids retriggering.
      - name: Commit cached golden set
        if: inputs.mode == 'build'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- scripts/golden_set.json)" ]; then
            git add scripts/golden_set.json
            git commit -m "golden: cache opinion text for the regression set [skip ci]"
            bash scripts/push_main.sh
          else
            echo "no golden-set changes to commit"
          fi

      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="A manually-triggered golden-check run failed. ${run_url}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Golden-check run failures' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Golden-check run failures" --body "$body"
          fi
