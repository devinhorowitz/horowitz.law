name: opinions-review-veto

# Per-case veto and decline for the bundled review PR. Both drop a case's staged file(s) from
# the bot/opinions-review branch, so merging the PR applies only the cases that remain; they
# differ in what happens to the dropped case when the batch is applied:
#   /veto <cluster_id>     -- left un-seen and recorded for redraft, so a later funnel run
#                             rediscovers and redrafts it (the draft was bad; try again).
#   /decline <cluster_id>  -- marked seen (via review/declined.json, read by review_apply), so
#                             the funnel never redrafts it (this case is not worth carding).
# Only the repo owner, an org member, or a collaborator can act; comments on any other PR are
# ignored.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: opinions-review-veto
  cancel-in-progress: false

jobs:
  veto:
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/veto') ||
       startsWith(github.event.comment.body, '/decline')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Drop the vetoed or declined case from the review branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -e
          # Confirm the comment is on the review PR, not some other PR.
          head=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName 2>/dev/null || echo "")
          if [ "$head" != "bot/opinions-review" ]; then
            echo "Comment is not on the review PR (head=$head); ignoring."
            exit 0
          fi
          # Parse the command and cluster id with the tested helper (review_store.parse_command):
          # one source for what counts as /veto|/decline <id>, rejecting look-alikes like /vetoed.
          parsed=$(python3 -c "import os, sys; sys.path.insert(0, 'scripts'); import review_store; c, i = review_store.parse_command(os.environ.get('COMMENT_BODY', '')); print((c or ''), (i if i is not None else ''))")
          read -r cmd id <<< "$parsed"
          if [ -z "$cmd" ]; then echo "Not a /veto or /decline command; ignoring."; exit 0; fi
          if [ -z "$id" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Could not read a cluster id from that comment. Use \`/${cmd} <cluster_id>\`." || true
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Is the case actually staged? Decide "not found" once, up front, against the current branch.
          # staged_files_for returns the held-card file plus any citing-treatment file that exist --
          # the same tested lookup used to drop them below, so the check and the removal can't diverge.
          git fetch origin bot/opinions-review
          git checkout -B bot/opinions-review origin/bot/opinions-review
          staged() { python3 -c "import sys; sys.path.insert(0, 'scripts'); import review_store; print('\n'.join(review_store.staged_files_for(int(sys.argv[1]))))" "$id"; }
          if [ -z "$(staged)" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "No staged case with cluster id ${id} was found in this batch." || true
            exit 0
          fi
          # Drop the staged file(s) and record the decision in the marker review_apply reads as
          # authoritative (so the case stays unpublished even if a racing scan restored its file),
          # then push -- retrying against the 4-hourly funnel's pushes of this same branch: on a
          # rejected push, re-fetch the (moved) branch and re-apply. record_decision (the marker
          # union) and staged_files_for (the exact files to drop) are the SAME tested Python the
          # funnel and review_apply use, so shell and Python can no longer drift on the veto
          # guarantee. Each step is idempotent, so a retry converges to a clean push.
          # The one marker file record_decision writes for this command. Add exactly it (it always
          # exists after the write): `git add` is atomic, so listing a not-yet-existing sibling
          # marker would stage NOTHING and the decision would never be committed.
          if [ "$cmd" = "veto" ]; then marker="review/vetoed.json"; else marker="review/declined.json"; fi
          ok=0
          for attempt in 1 2 3 4 5; do
            for f in $(staged); do git rm -f "$f" 2>/dev/null || true; done
            python3 -c "import sys; sys.path.insert(0, 'scripts'); import review_store; review_store.record_decision(sys.argv[1], int(sys.argv[2]))" "$cmd" "$id"
            git add "$marker"
            git commit -m "review: ${cmd} case ${id}" 2>/dev/null || true
            if git push origin bot/opinions-review; then ok=1; break; fi
            echo "${cmd} push rejected (review branch moved under a scan); refetching and retrying ($attempt)"
            sleep $((attempt * 3))
            git fetch origin bot/opinions-review
            git checkout -B bot/opinions-review origin/bot/opinions-review
          done
          if [ "$ok" = "1" ]; then
            if [ "$cmd" = "decline" ]; then
              msg="Declined case ${id}: dropped from this batch and marked seen -- the funnel will NOT redraft it. Merging now applies only the remaining cases."
            else
              msg="Vetoed case ${id}: dropped from this batch and left eligible for a later run to redraft. Merging now applies only the remaining cases."
            fi
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$msg" || true
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "⚠️ Could not apply the ${cmd} of case ${id} after several retries -- the review branch kept moving under a scan. Please re-run \`/${cmd} ${id}\` in a minute, and do NOT merge this PR until the confirmation posts." || true
          echo "::error::${cmd} of ${id} could not be pushed after retries"
          exit 1
