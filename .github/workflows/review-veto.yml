name: opinions-review-veto

# Per-case veto for the bundled review PR. Comment `/veto <cluster_id>` on the review PR and
# this drops that case's staged file(s) from the bot/opinions-review branch, so merging the PR
# applies only the cases that remain. The vetoed case is left un-seen (recorded for redraft when
# the batch is applied), so a later funnel run rediscovers and redrafts it. Only the repo owner,
# an org member, or a collaborator can veto; comments on any other PR are ignored.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: opinions-review-veto
  cancel-in-progress: false

jobs:
  veto:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/veto') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Drop the vetoed case from the review branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -e
          # Confirm the comment is on the review PR, not some other PR.
          head=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName 2>/dev/null || echo "")
          if [ "$head" != "bot/opinions-review" ]; then
            echo "Comment is not on the review PR (head=$head); ignoring."
            exit 0
          fi
          # Parse the cluster id from `/veto <id>` (first integer after the command).
          id=$(printf '%s' "$COMMENT_BODY" | grep -oE '/veto[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$id" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Could not read a cluster id from that comment. Use \`/veto <cluster_id>\`." || true
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Is the case actually staged? Decide "not found" once, up front, against the current branch.
          git fetch origin bot/opinions-review
          git checkout -B bot/opinions-review origin/bot/opinions-review
          present=0
          [ -e "review/cards/${id}.json" ] && present=1
          # Treatment files are named <cardcid>__<citercid>.json; a case vetoed by its citing id.
          for f in review/treatments/*__${id}.json; do [ -e "$f" ] && present=1; done
          if [ "$present" = "0" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "No staged case with cluster id ${id} was found in this batch." || true
            exit 0
          fi
          # Remove the case and push, retrying against the 4-hourly funnel's force-pushes of this
          # same branch: on a rejected push, re-fetch the (moved) branch and re-apply the removal --
          # if the funnel restored the vetoed file, this drops it again -- so a veto is never
          # silently clobbered. `git rm`/commit are guarded so an already-absent file (a prior
          # attempt landed, or the funnel dropped it) still converges to a clean push.
          ok=0
          for attempt in 1 2 3 4 5; do
            git rm -f "review/cards/${id}.json" 2>/dev/null || true
            for f in review/treatments/*__${id}.json; do [ -e "$f" ] || continue; git rm -f "$f" 2>/dev/null || true; done
            git commit -m "review: veto case ${id}" 2>/dev/null || true
            if git push origin bot/opinions-review; then ok=1; break; fi
            echo "veto push rejected (review branch moved under a scan); refetching and retrying ($attempt)"
            sleep $((attempt * 3))
            git fetch origin bot/opinions-review
            git checkout -B bot/opinions-review origin/bot/opinions-review
          done
          if [ "$ok" = "1" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Vetoed case ${id}: dropped from this batch and left eligible for a later run to redraft. Merging now applies only the remaining cases." || true
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "⚠️ Could not apply the veto of case ${id} after several retries -- the review branch kept moving under a scan. Please re-run \`/veto ${id}\` in a minute, and do NOT merge this PR until the confirmation posts." || true
          echo "::error::veto of ${id} could not be pushed after retries"
          exit 1
