name: opinions-heartbeat

# Dead-man's-switch for the unattended deployment. Every other alert in this repo is a GitHub
# issue opened by a workflow's failure step -- which only fires if that workflow RUNS. This job is
# the out-of-band check for the failure modes that produce no run and no signal: a CourtListener
# feed-shape change (silent zero discovery), a retired model that stalls the funnel, a stuck
# upstream status-page outage the preflight skips on, an expired key, or the 60-day auto-disable.
# scripts/heartbeat.py reads the committed freshness markers (public/status.json scanned_at, and the
# newest card in opinions.json) and exits nonzero when the funnel looks stalled; this opens/updates
# a tracking issue, and closes it when things recover.
#
# It cannot catch a TOTAL 60-day auto-disable (which takes this cron down too). For that, set the
# HEARTBEAT_PING_URL secret to an external cron-monitor ping URL (e.g. a free healthchecks.io
# check) and add its host to allowed-endpoints below: this job pings it only on a healthy run, so
# the external monitor alerts you when the pings stop -- even if all of GitHub's crons are disabled.
#
# This job also carries a SECOND, independent check: the age of skill-authorities.json (exit 5, its
# own issue, its own self-heal). Same family of problem -- a file that rots silently because nothing
# in CI can refresh it -- but a separate verdict, so it never contaminates the stall signal or the
# healthy-run ping. See the step comment below.

on:
  schedule:
    - cron: '7 6 * * *'   # daily, offset from the funnel (:17 every 4h) and maintenance (13:37)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: opinions-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # github.com/api.github.com for checkout + gh; the *.githubusercontent hosts in case a
          # runner image lacks Python 3.12 in the toolcache (raw.* = versions manifest,
          # release-assets.* = the tarball, which github.com 302s to since April 2025).
          # If you set HEARTBEAT_PING_URL, add its
          # host here too (e.g. hc-ping.com:443), or the ping step will be blocked (harmless).
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Check funnel freshness
        id: hb
        run: |
          set +e
          python scripts/heartbeat.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e

      # Stalled (exit 3 = funnel not running; 4 = no new cards): open or update the one tracking issue.
      - name: Alert on a stall
        if: ${{ steps.hb.outputs.code == '3' || steps.hb.outputs.code == '4' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(cat scripts/heartbeat_alert.md 2>/dev/null || echo "The funnel heartbeat check failed; see the run log.")
          title="Funnel heartbeat: possible stall"
          num=$(bash scripts/gh_retry.sh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            bash scripts/gh_retry.sh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            bash scripts/gh_retry.sh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      # --- Second, independent signal: the skill-authority manifest's age. -----------------
      # skill-authorities.json is the join key alert-out reads to decide which adverse treatments
      # matter, and it is generated from a skill tree at /mnt/skills/user that NO workflow has --
      # so it cannot regenerate here, only go stale, and a stale one looks exactly like a working
      # one (skill_alert.py fails open). This is a separate step with its own exit code, its own
      # issue and its own self-heal because a stale manifest says nothing about whether the funnel
      # is alive: folding it into the check above would mislabel the issue "possible stall" and,
      # worse, suppress the healthy-run ping below, making a rotting file look like GitHub's crons
      # had died.
      - name: Check the skill-authority manifest's age
        id: sm
        run: |
          set +e
          python scripts/heartbeat.py --skill-manifest
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Alert on a stale skill manifest
        if: ${{ steps.sm.outputs.code == '5' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(cat scripts/skill_manifest_alert.md 2>/dev/null || echo "The skill-authority manifest check failed; see the run log.")
          title="Skill-authority manifest is stale"
          num=$(bash scripts/gh_retry.sh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            bash scripts/gh_retry.sh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            bash scripts/gh_retry.sh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close the stale-manifest issue once it is regenerated
        if: ${{ steps.sm.outputs.code == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Skill-authority manifest is stale"
          for n in $(bash scripts/gh_retry.sh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[].number' 2>/dev/null || true); do
            bash scripts/gh_retry.sh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Recovered: skill-authorities.json is within its age threshold again." || true
            bash scripts/gh_retry.sh issue close "$n" --repo "$GITHUB_REPOSITORY" || true
          done

      # Healthy: close any open heartbeat issue (self-heal) and ping the optional external monitor.
      - name: Recover and ping
        if: ${{ steps.hb.outputs.code == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEARTBEAT_PING_URL: ${{ secrets.HEARTBEAT_PING_URL }}
        run: |
          title="Funnel heartbeat: possible stall"
          for n in $(bash scripts/gh_retry.sh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[].number' 2>/dev/null || true); do
            bash scripts/gh_retry.sh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Recovered: the funnel heartbeat is healthy again." || true
            bash scripts/gh_retry.sh issue close "$n" --repo "$GITHUB_REPOSITORY" || true
          done
          if [ -n "$HEARTBEAT_PING_URL" ]; then
            curl -fsS -m 15 "$HEARTBEAT_PING_URL" >/dev/null 2>&1 && echo "external monitor pinged" || echo "external ping skipped (host not reachable/allow-listed)"
          fi
