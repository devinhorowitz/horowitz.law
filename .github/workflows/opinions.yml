name: Georgia Appellate Watch update

on:
  schedule:
    - cron: '17 11 * * *'   # daily at 11:17 UTC (about 6-7am Eastern). Adjust freely.
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

# Workflow-wide environment.
#  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 silences the Node 20 deprecation warning by
#  running the prebuilt actions on Node 24 now (the default after June 16, 2026).
#  PYTHONUNBUFFERED makes the script stream its log live instead of in one burst.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUNBUFFERED: '1'

concurrency:
  group: opinions-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --upgrade pypdf

      - name: Fetch, screen, triage, summarize, render
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          # Three-tier funnel, cheapest first. Model ids per the Anthropic models docs.
          OPINIONS_SCREEN_MODEL: claude-haiku-4-5-20251001   # tier 1: excerpt screen ($1/$5 per MTok)
          OPINIONS_TRIAGE_MODEL: claude-sonnet-4-6           # tier 2: full-read gate ($3/$15 per MTok)
          OPINIONS_MODEL: claude-opus-4-8                    # tier 3: public summary ($5/$25, effort=high by default)
          OPINIONS_MAX: '80'                                 # candidates evaluated per run (headroom for heavy filing days)
        run: python scripts/update.py

      # Opens or updates a pull request only when the run changed tracked files.
      # Confirm the latest tag at github.com/peter-evans/create-pull-request before pinning.
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/opinions-update
          title: 'Georgia Appellate Watch: new opinions'
          commit-message: 'opinions: add new Georgia appellate decisions'
          body-path: scripts/pr_body.md
          labels: opinions, automated
          delete-branch: true
          add-paths: |
            opinions.json
            opinions.xml
            opinions_state.json
            opinions.html
