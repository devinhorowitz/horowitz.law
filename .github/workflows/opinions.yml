name: Georgia Appellate Watch update

on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours. A slot lost to an outage retries at the next slot
                             # instead of waiting a full day. Held cases are tracked in the
                             # pending-review ledger so a slot never re-summarizes an open case.
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write
  issues: write          # the failure-alert step opens or comments on a tracking issue

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: opinions-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # watchdog: a hung run fails fast instead of running to the 6h cap
    steps:
      # Supply-chain hardening (block mode): only the endpoints below are reachable.
      #   api.anthropic.com         the screen/triage/summarize model calls (update.py).
      #   status.claude.com         update.py's pre-flight outage check (the status page's real host).
      #   www.courtlistener.com     the feeds and REST API (update.py).
      #   storage.courtlistener.com the opinion PDFs (update.py).
      #   pypi.org                  the pip index for the pypdf install.
      #   files.pythonhosted.org    the pypdf wheel download.
      #   github.com                checkout, the branch pushes to main and bot/opinions-review.
      #   api.github.com            the review-PR open and the failure-alert gh steps.
      #   *.githubusercontent.com   only reached if a future runner image drops 3.12 from the
      #                             toolcache and setup-python must download it; harmless otherwise.
      # Actions cache/infra endpoints are auto-allowed.
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            status.claude.com:443
            www.courtlistener.com:443
            storage.courtlistener.com:443
            pypi.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            api.github.com:443

      # Full history + all branches, so the review-lane step can rebase bot/opinions-review
      # onto the current main and restore the cases already staged there.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, screen, triage, summarize, render
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          CL_PER_MINUTE: ${{ vars.CL_PER_MINUTE }}
          CL_PER_HOUR: ${{ vars.CL_PER_HOUR }}
          CL_PER_DAY: ${{ vars.CL_PER_DAY }}
          CL_RATE_MARGIN: ${{ vars.CL_RATE_MARGIN }}
          OPINIONS_SCREEN_MODEL: ${{ vars.OPINIONS_SCREEN_MODEL || 'claude-haiku-4-5' }}
          OPINIONS_PRETRIAGE_MODEL: ${{ vars.OPINIONS_PRETRIAGE_MODEL || '' }}
          OPINIONS_TRIAGE_MODEL: ${{ vars.OPINIONS_TRIAGE_MODEL || 'claude-sonnet-5' }}
          OPINIONS_MODEL: ${{ vars.OPINIONS_MODEL || 'claude-opus-4-8' }}
          OPINIONS_MAX: ${{ vars.OPINIONS_MAX || '80' }}
          # Senior Fable review of held cases: 'clear' auto-publishes a held card Fable is highly
          # confident is a false positive (fail-closed); set the repo Variable to 'advisory' to
          # only attach its verdict to the review PR, or 'off' to disable. Model is overridable too.
          OPINIONS_FABLE_REVIEW: ${{ vars.OPINIONS_FABLE_REVIEW || 'clear' }}
          OPINIONS_FABLE_MODEL: ${{ vars.OPINIONS_FABLE_MODEL || 'claude-fable-5' }}
        run: |
          set -o pipefail
          python scripts/update.py 2>&1 | tee "$RUNNER_TEMP/run.log"

      # AUTO lane. Additive, unflagged cards that touch no existing card were written to
      # opinions.json and re-rendered by update.py; they publish straight to main with the
      # run's bookkeeping (seen-state, the pending-review ledger, logs). Held cases are NOT
      # here -- they live under review/, handled by the next step. If auto content changed,
      # the commit is left to trigger CI (render/site invariants); a bookkeeping-only run
      # uses [skip ci].
      - name: Publish auto cards and bookkeeping to main
        id: automain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The publish decision -- which existing files to stage, and whether this is an auto-publish
          # (new site content) or a bookkeeping-only run -- lives in scripts/publish.py, not in bash.
          # That is deliberate: file-selection in an untested shell step caused this project's two
          # write-to-main incidents (git add choking atomically on a missing conditional ledger; a
          # hand-maintained file list drifting from what render writes). publish.py is unit-tested,
          # derives its content set from render.OUTPUT_PATHS so it cannot drift, and lists only paths
          # that exist. It prints: line 1 = mode (auto|bookkeeping|noop), remaining lines = paths to add.
          if ! plan=$(python scripts/publish.py); then
            echo "::error::publish.py failed to compute the publish plan"; exit 1
          fi
          # Parse the plan pipe-free (a here-string into mapfile, not `... | head`): under the
          # runner's `set -eo pipefail`, a pipe whose reader exits early can surface a SIGPIPE and
          # abort the step. line 0 = mode, the rest = existing paths to stage.
          mapfile -t lines <<< "$plan"
          mode="${lines[0]}"
          files=("${lines[@]:1}")
          echo "auto=$([ "$mode" = auto ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "noop" ]; then echo "Nothing to publish this run."; exit 0; fi
          if [ "$mode" = "auto" ]; then msg="opinions: publish new appellate decisions"; else msg="opinions: record run state [skip ci]"; fi
          for f in "${files[@]}"; do [ -n "$f" ] && git add "$f"; done
          # Push only if the commit captured something: never hand push_main a dirty tree (its rebase
          # aborts on unstaged changes). publish.py lists only existing paths, so git add cannot choke
          # on a missing file and leave the tree dirty -- the exact failure mode this replaces.
          if git commit -m "$msg"; then
            bash scripts/push_main.sh
          else
            echo "::warning::publish plan was '$mode' but nothing was committed; skipping push"
          fi

      # REVIEW lane. Any case that overrules/modifies an existing card, a new card that causes
      # such a change, or a guard-flagged card was staged by update.py under review/. Rebase the
      # bot/opinions-review branch onto the just-updated main and restore the cases already
      # staged there, so the branch's ONLY diff from main is the review/ files -- merging it can
      # never revert an auto card that landed on main meanwhile. Open the bundled review PR if
      # one is not already open; a person accepts by merging and vetoes a case with `/veto <id>`.
      - name: Stage held cases in the review PR
        if: ${{ hashFiles('review/**') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep this run's freshly staged files aside; they are untracked on main.
          rm -rf "$RUNNER_TEMP/review-new"
          cp -r review "$RUNNER_TEMP/review-new"
          [ -f scripts/pr_body_review.md ] && cp scripts/pr_body_review.md "$RUNNER_TEMP/pr_body_review.md"
          git fetch origin main
          git checkout -B bot/opinions-review origin/main
          # Restore cases already staged on the existing review branch (vetoed files stay gone).
          branch_existed=0
          if git fetch origin bot/opinions-review 2>/dev/null; then
            git checkout origin/bot/opinions-review -- review 2>/dev/null || true
            branch_existed=1
          fi
          # Union in this run's new files via the tested Python reconciliation (not a blind cp), so
          # a case already vetoed/declined on the branch cannot be resurrected into the PR by a
          # re-discovery, and the "which files survive" logic is covered by scripts/test_review.py.
          # Commit ONLY review/ so the branch's sole diff from main is the staged cases -- merging
          # it can never revert an auto card, and the PR body file never leaks onto main.
          python scripts/review_stage.py "$RUNNER_TEMP/review-new" review
          git add review
          if git diff --cached --quiet; then
            echo "No new review-lane changes to push."
            exit 0
          fi
          git commit -m "opinions: stage case(s) for review"
          # --force-with-lease (not plain -f) so this cannot silently clobber a /veto that landed
          # on the branch since the fetch above: if a veto raced in, the lease is stale and the push
          # is rejected -- this run fails and alerts, and the next scan rebuilds cleanly with the veto
          # intact. Plain -f only for the first-ever push, when there is no remote branch to lease on.
          if [ "$branch_existed" = "1" ]; then
            git push --force-with-lease origin bot/opinions-review
          else
            git push -f origin bot/opinions-review
          fi
          BODY="$RUNNER_TEMP/pr_body_review.md"
          [ -f "$BODY" ] || echo "Cases held for review." > "$BODY"
          num=$(gh pr list --repo "$GITHUB_REPOSITORY" --head bot/opinions-review --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$num" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head bot/opinions-review --base main \
              --title 'Georgia Appellate Watch: cases held for review' \
              --body-file "$BODY" \
              --label opinions --label review || echo "PR create skipped"
          else
            gh pr edit "$num" --repo "$GITHUB_REPOSITORY" --body-file "$BODY" || echo "PR body refresh skipped"
          fi
          echo "Review PR carries the held cases; accept by merging, veto a case with /veto <cluster_id>." >> "$GITHUB_STEP_SUMMARY"

      # Freshness indicator for the opinions page: last-scanned time and whether a review batch
      # is pending. Pure metadata straight to main, [skip ci]. Best-effort.
      - name: Publish scan status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -B bot/scan-status origin/main
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --head bot/opinions-review --state open --json number --jq 'length' 2>/dev/null || echo 0)
          scanned_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          content_updated_at=$(git log -1 --format=%cI -- opinions.json 2>/dev/null || true)
          printf '{\n  "scanned_at": "%s",\n  "pending": %s,\n  "content_updated_at": "%s"\n}\n' \
            "$scanned_at" "${pending:-0}" "$content_updated_at" > public/status.json
          git add public/status.json
          if git diff --cached --quiet; then
            echo "status.json unchanged; nothing to commit."
          else
            git commit -m "opinions: scan status [skip ci]"
            bash scripts/push_main.sh
          fi

      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          logtail=$(tail -c 3500 "$RUNNER_TEMP/run.log" 2>/dev/null || true)
          body=$(printf 'A scheduled opinions funnel run failed.\n\n%s\n\n**Last output**\n\n```\n%s\n```\n' "$run_url" "${logtail:-(no run output captured)}")
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Opinions funnel run failures' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Opinions funnel run failures" --body "$body"
          fi
