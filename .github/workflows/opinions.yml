name: Georgia Appellate Watch update

on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours. A slot lost to an outage retries at the next slot
                             # instead of waiting a full day. The guard step below keeps the
                             # extra slots from reprocessing the same opinions. Adjust freely.
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write
  issues: write          # the failure-alert step opens or comments on a tracking issue

# Workflow-wide environment. PYTHONUNBUFFERED makes the script stream its log live
# instead of in one burst at the end.
env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: opinions-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # watchdog: a hung daily run fails fast instead of running to the 6h cap
    steps:
      # Supply-chain hardening (audit mode): records what this job sends over the
      # network, so you can review egress and later switch to block with an allowlist.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      # Faster cadence is only safe if a slot does not redo work that is already
      # waiting in an open PR. opinions_state.json advances only when that PR merges,
      # so on a scheduled run, if an opinions PR is already open, skip: a later slot
      # will run once it is merged. Manual runs never skip, so you can always force one.
      # Fail-open: if the PR check itself errors, the run proceeds.
      - name: Skip scheduled run if an opinions PR is already open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head bot/opinions-update --state open --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "${open:-0}" != "0" ]; then
              echo "An opinions PR is already open and awaiting merge; skipping this slot to avoid reprocessing."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Manual run; not skipping."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --upgrade "pypdf>=5,<6"

      - name: Fetch, screen, triage, summarize, render
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          # CourtListener REST budget. Set these repo Variables on a tier change; unset = free-tier defaults in cl_rate.py.
          CL_PER_MINUTE: ${{ vars.CL_PER_MINUTE }}
          CL_PER_HOUR: ${{ vars.CL_PER_HOUR }}
          CL_PER_DAY: ${{ vars.CL_PER_DAY }}
          CL_RATE_MARGIN: ${{ vars.CL_RATE_MARGIN }}
          # Three-tier funnel, cheapest first. Model ids per the Anthropic models docs.
          # Model ids. Set the matching repo Variable (Settings > Secrets and variables >
          # Actions > Variables) to change a model without editing this file; the value
          # after || is the fallback default. Update the Variable if a model is retired.
          OPINIONS_SCREEN_MODEL: ${{ vars.OPINIONS_SCREEN_MODEL || 'claude-haiku-4-5-20251001' }}   # tier 1: excerpt screen
          OPINIONS_PRETRIAGE_MODEL: ${{ vars.OPINIONS_PRETRIAGE_MODEL || '' }}                       # tier 1.5: Haiku full-read screen; set repo Variable to claude-haiku-4-5-20251001 to enable after the recall check passes
          OPINIONS_TRIAGE_MODEL: ${{ vars.OPINIONS_TRIAGE_MODEL || 'claude-sonnet-4-6' }}           # tier 2: full-read gate
          OPINIONS_MODEL: ${{ vars.OPINIONS_MODEL || 'claude-opus-4-8' }}                            # tier 3: public summary
          OPINIONS_MAX: ${{ vars.OPINIONS_MAX || '80' }}     # candidates per run; override via repo Variable (headroom for heavy filing days)
        run: python scripts/update.py

      # Decide whether this run changed site content (which goes through a review PR) or
      # only the seen-state bookkeeping on a no-op (which is committed straight to main).
      - name: Classify what changed
        id: classify
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -n "$(git status --porcelain -- opinions.json opinions.xml opinions.html archive.html)" ]; then
            echo "kind=content" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git status --porcelain -- opinions_state.json opinions_pipeline_log.jsonl opinions_rejections.jsonl)" ]; then
            echo "kind=state" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi

      # Opens or updates a pull request only when the run changed tracked files.
      # Pinned to a commit SHA below; the trailing # v8 is the readable version. Bump both together when updating.
      - name: Open pull request
        if: steps.guard.outputs.skip != 'true' && steps.classify.outputs.kind == 'content'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: bot/opinions-update
          title: 'Georgia Appellate Watch: new opinions'
          commit-message: 'opinions: add new Georgia appellate decisions'
          body-path: scripts/pr_body.md
          labels: opinions, automated
          delete-branch: true
          add-paths: |
            opinions.json
            opinions.xml
            opinions_state.json
            opinions.html
            archive.html
            sitemap.xml
            opinions_rejections.jsonl
            changes.html
            changes.xml
            stats.html
            digests.html
            o

      # No-op run: the funnel carded nothing, so there is no review PR. It still records this
      # run's health stats, and marks the clusters it screened as seen so the next run does not
      # re-evaluate them. Both are bookkeeping, not editorial content, so they go straight to
      # main with no PR. [skip ci] keeps the push from triggering other workflows. (On a content
      # run the stats line is not persisted here; that run is documented by its PR and opinions.json.)
      - name: Commit run stats and seen-state on a no-op run
        if: steps.guard.outputs.skip != 'true' && steps.classify.outputs.kind == 'state'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opinions_state.json opinions_pipeline_log.jsonl opinions_rejections.jsonl 2>/dev/null || git add opinions_state.json opinions_pipeline_log.jsonl
          git commit -m "opinions: record run stats; mark screened cases seen [skip ci]"
          git push origin HEAD:main

      # Writes a tiny status.json (last-scanned time, whether a review batch is pending,
      # when content last landed on main) straight to main -- the same no-review lane the
      # no-op commit above uses. The opinions page reads it client-side for its freshness
      # indicator. Pure metadata, so [skip ci] and no PR. Runs on any successful, non-skipped
      # run (content, state, or none); a guard-skip means no scan happened, so nothing to
      # refresh. Best-effort: continue-on-error keeps a status hiccup from failing the funnel.
      - name: Publish scan status
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -B bot/scan-status origin/main
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --head bot/opinions-update --state open --json number --jq 'length' 2>/dev/null || echo 0)
          scanned_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          content_updated_at=$(git log -1 --format=%cI -- opinions.json 2>/dev/null || true)
          printf '{\n  "scanned_at": "%s",\n  "pending": %s,\n  "content_updated_at": "%s"\n}\n' \
            "$scanned_at" "${pending:-0}" "$content_updated_at" > status.json
          git add status.json
          if git diff --cached --quiet; then
            echo "status.json unchanged; nothing to commit."
          else
            git commit -m "opinions: scan status [skip ci]"
            git push origin HEAD:main
          fi

      # Surfaces a broken run instead of letting it fail silently. Runs only on failure,
      # finds the one open tracking issue and comments, or opens it the first time, so
      # repeated failures collect on a single issue rather than spamming new ones.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="A scheduled opinions funnel run failed. ${run_url}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Opinions funnel run failures' --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Opinions funnel run failures" --body "$body"
          fi
