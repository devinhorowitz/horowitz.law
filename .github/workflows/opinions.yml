name: Georgia Appellate Watch update

on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours. A slot lost to an outage retries at the next slot
                             # instead of waiting a full day. The guard step below keeps the
                             # extra slots from reprocessing the same opinions. Adjust freely.
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

# Workflow-wide environment. PYTHONUNBUFFERED makes the script stream its log live
# instead of in one burst at the end.
env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: opinions-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # watchdog: a hung daily run fails fast instead of running to the 6h cap
    steps:
      # Faster cadence is only safe if a slot does not redo work that is already
      # waiting in an open PR. opinions_state.json advances only when that PR merges,
      # so on a scheduled run, if an opinions PR is already open, skip: a later slot
      # will run once it is merged. Manual runs never skip, so you can always force one.
      # Fail-open: if the PR check itself errors, the run proceeds.
      - name: Skip scheduled run if an opinions PR is already open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head bot/opinions-update --state open --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "${open:-0}" != "0" ]; then
              echo "An opinions PR is already open and awaiting merge; skipping this slot to avoid reprocessing."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Manual run; not skipping."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --upgrade "pypdf>=5,<6"

      - name: Fetch, screen, triage, summarize, render
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          # CourtListener REST budget. Set these repo Variables on a tier change; unset = free-tier defaults in cl_rate.py.
          CL_PER_MINUTE: ${{ vars.CL_PER_MINUTE }}
          CL_PER_HOUR: ${{ vars.CL_PER_HOUR }}
          CL_PER_DAY: ${{ vars.CL_PER_DAY }}
          CL_RATE_MARGIN: ${{ vars.CL_RATE_MARGIN }}
          # Three-tier funnel, cheapest first. Model ids per the Anthropic models docs.
          # Model ids. Set the matching repo Variable (Settings > Secrets and variables >
          # Actions > Variables) to change a model without editing this file; the value
          # after || is the fallback default. Update the Variable if a model is retired.
          OPINIONS_SCREEN_MODEL: ${{ vars.OPINIONS_SCREEN_MODEL || 'claude-haiku-4-5-20251001' }}   # tier 1: excerpt screen
          OPINIONS_TRIAGE_MODEL: ${{ vars.OPINIONS_TRIAGE_MODEL || 'claude-sonnet-4-6' }}           # tier 2: full-read gate
          OPINIONS_MODEL: ${{ vars.OPINIONS_MODEL || 'claude-opus-4-8' }}                            # tier 3: public summary
          OPINIONS_MAX: '80'                                 # candidates evaluated per run (headroom for heavy filing days)
        run: python scripts/update.py

      # Opens or updates a pull request only when the run changed tracked files.
      # Confirm the latest tag at github.com/peter-evans/create-pull-request before pinning.
      - name: Open pull request
        if: steps.guard.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/opinions-update
          title: 'Georgia Appellate Watch: new opinions'
          commit-message: 'opinions: add new Georgia appellate decisions'
          body-path: scripts/pr_body.md
          labels: opinions, automated
          delete-branch: true
          add-paths: |
            opinions.json
            opinions.xml
            opinions_state.json
            opinions.html
            archive.html
