name: opinions-diagnose

# When a monitor workflow opens a tracking issue (a run failure, a heartbeat stall, a feed/registry
# drift, broken links, a Lighthouse regression), post ONE best-effort AI diagnosis as a comment, so
# whoever picks it up starts with a hypothesis instead of a cold log. scripts/diagnose.py feeds the
# issue text plus the committed runbook (docs/MAINTENANCE.md) to a capable model (Fable by default)
# and writes a comment only when there is something to say. It is an aid, not an authority: the model
# has no live repo access, and the whole thing fails silently -- a broken diagnostic must never
# become a second alert.
#
# Scope + safety: runs ONLY on issues our own automation opened (github-actions[bot]), so it never
# acts on arbitrary human-filed text. The issue title/body reach the script through env vars, never
# interpolated into a shell line, so issue content cannot inject shell.

on:
  issues:
    types: [opened]

permissions:
  contents: read      # checkout; diagnose.py reads docs/MAINTENANCE.md from the tree for grounding
  issues: write       # post the diagnosis comment

concurrency:
  group: diagnose-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    # Only diagnose issues opened by our own monitors; ignore human-filed issues entirely.
    if: ${{ github.event.issue.user.login == 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15    # the call runs through the Batch API (50% cheaper), so the job polls for
                           # the result -- usually minutes; diagnose.py caps its wait at DIAGNOSE_BATCH_SEC (480s)
    steps:
      # Block egress: only the diagnosis call and GitHub (checkout + gh comment). The Batch API lives
      # on api.anthropic.com too, so no new endpoint. No CourtListener, no PyPI -- diagnose.py imports
      # update and batch, but both load on the stdlib alone (pypdf, the only third-party in the chain,
      # is imported lazily), so no install step is needed.
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Diagnose the issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed as env, NOT interpolated into the run script: issue content stays data, not shell.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        # Best-effort: diagnose.py already exits 0 on every internal failure; the `|| echo` also keeps
        # a hard crash (e.g. a future import break) from turning this enhancement into a red run.
        run: python scripts/diagnose.py || echo "diagnose step skipped (see log)"

      # Post only if a diagnosis was actually written (hashFiles is '' when the file is absent).
      - name: Post the diagnosis
        if: ${{ hashFiles('scripts/diagnosis.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gh_retry.sh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file scripts/diagnosis.md
